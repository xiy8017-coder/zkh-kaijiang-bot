    <script>
        const $ = id => document.getElementById(id);
        const API_URL = 'https://super.pc28998.com/history/JND28';
        const STORAGE_KEY = 'tianzhen_dujia_shazu_v1';
        const PERIOD_INTERVAL = 210;
        const AUTO_REFRESH_INTERVAL = 10000;
        const RING_CIRCUMFERENCE = 2 * Math.PI * 38;
        // 数值转形态映射表（0-27对应）
        const NUM_TO_TYPE = [
            '小双', '小单', '小双', '小单', '小双', '小单', '小双', '小单',
            '小双', '小单', '小双', '小单', '小双', '小单', '大双', '大单',
            '大双', '大单', '大双', '大单', '大双', '大单', '大双', '大单',
            '大双', '大单', '大双', '大单'
        ];
        // 【新三门规则】完全按你要求重写
        const THREE_DOORS = {
            '小单': ['大单', '大双', '小单'],
            '大双': ['大双', '小双', '小单'],
            '小双': ['大单', '大双', '小双'],
            '大单': ['大单', '小双', '小单']
        };
        // 杀组转换规则（杀组不在三门时启用）
        const KILL_TRANS_MAP = {
            '大单': '小双',
            '大双': '小单',
            '小单': '大双',
            '小双': '大单'
        };
        // 月之眼分组（特码候选池）
        const MOON_EYE_GROUPS = {
            '月': [9, 12, 15, 18],
            '之': [7, 10, 16, 19],
            '眼': [8, 11, 17, 20]
        };
        // 和值转大小单双
        function getTypeFromSum(sum) {
            const size = sum < 14 ? '小' : '大';
            const parity = sum % 2 === 0 ? '双' : '单';
            return size + parity;
        }
        // 根据特征值S获取源分组
        function getSourceGroups(S) {
            let group = null;
            for (let [key, nums] of Object.entries(MOON_EYE_GROUPS)) {
                if (nums.includes(S)) { group = key; break; }
            }
            if (!group) {
                let minDiff = Infinity, bestGroup = '月';
                for (let [key, nums] of Object.entries(MOON_EYE_GROUPS)) {
                    for (let num of nums) {
                        let diff = Math.abs(num - S);
                        if (diff < minDiff) { minDiff = diff; bestGroup = key; }
                    }
                }
                group = bestGroup;
            }
            if (group === '月') return ['月', '之'];
            if (group === '之') return ['之', '眼'];
            return ['眼', '月'];
        }
        // 特码四码生成函数
        function generateSpecialCodes(S, finalRecs) {
            const sourceGroups = getSourceGroups(S);
            let selected = new Set();
            for (let rec of finalRecs) {
                for (let groupName of sourceGroups) {
                    for (let num of MOON_EYE_GROUPS[groupName]) {
                        if (getTypeFromSum(num) === rec) selected.add(num);
                    }
                }
            }
            let specials = Array.from(selected).sort((a, b) => a - b).slice(0, 4);
            if (specials.length < 4) {
                const allNums = [...MOON_EYE_GROUPS['月'], ...MOON_EYE_GROUPS['之'], ...MOON_EYE_GROUPS['眼']];
                for (let n of allNums) {
                    if (!specials.includes(n)) {
                        specials.push(n);
                        if (specials.length >= 4) break;
                    }
                }
            }
            return specials;
        }

        // ========== 全新核心算法：完全替换为你提供的计算逻辑 ==========
        function tianzhenAlgorithm(threePeriods) {
            let log = '';
            // 1. 提取三期开奖号码，分别计算三期原始和值
            const p1 = threePeriods[0];
            const p2 = threePeriods[1];
            const p3 = threePeriods[2];
            const sum1 = p1[0] + p1[1] + p1[2];
            const sum2 = p2[0] + p2[1] + p2[2];
            const sum3 = p3[0] + p3[1] + p3[2];
            log += `【输入三期开奖】\n第1期号码${p1.join('+')} 和值=${sum1}\n第2期号码${p2.join('+')} 和值=${sum2}\n第3期号码${p3.join('+')} 和值=${sum3}\n\n`;

            // 步骤1：三期和值转为带小数点小数（14→1.4、7→0.7）
            const dec1 = sum1 / 10;
            const dec2 = sum2 / 10;
            const dec3 = sum3 / 10;
            log += `【步骤1 和值转小数】\n${sum1} → ${dec1.toFixed(1)}\n${sum2} → ${dec2.toFixed(1)}\n${sum3} → ${dec3.toFixed(1)}\n`;

            // 步骤2：三个小数相加 = 总和一
            const sumOne = dec1 + dec2 + dec3;
            log += `三个小数相加：${dec1.toFixed(1)} + ${dec2.toFixed(1)} + ${dec3.toFixed(1)} = ${sumOne.toFixed(2)} → 总和一\n`;

            // 步骤3：三期原始和值总和
            const rawSumTotal = sum1 + sum2 + sum3;
            log += `三期原始和值相加：${sum1}+${sum2}+${sum3} = ${rawSumTotal} → 三期和总值\n`;

            // 步骤4：总和一 - 三期和总值 = 总和二
            const sumTwo = sumOne - rawSumTotal;
            log += `【步骤4 求总和二】${sumOne.toFixed(2)} - ${rawSumTotal} = ${sumTwo.toFixed(4)}\n`;

            // 固定除数 1.5*1.9*1.8 = 5.13
            const DIV_NUM = 1.5 * 1.9 * 1.8;
            log += `固定除数 = 1.5 × 1.9 × 1.8 = ${DIV_NUM}\n`;

            // 步骤5：总和二 ÷ 5.13 = 结果一
            const resOne = sumTwo / DIV_NUM;
            log += `【步骤5 计算结果一】${sumTwo.toFixed(4)} ÷ ${DIV_NUM} = ${resOne.toFixed(12)}\n`;

            // 步骤6：取小数点后三位，负数也只取小数部分，不足三位补0
            let decimalStr = String(Math.abs(resOne)).split('.')[1] || '000';
            // 截取前三位，不足补0
            const threeBit = decimalStr.padEnd(3, '0').slice(0, 3);
            const d1 = parseInt(threeBit[0]);
            const d2 = parseInt(threeBit[1]);
            const d3 = parseInt(threeBit[2]);
            log += `【步骤6 截取小数后三位】\n绝对值小数段：${decimalStr}\n截取三位：${threeBit} → 数字${d1}、${d2}、${d3}\n`;

            // 步骤7：三位数字相加得到最终数
            const finalNum = d1 + d2 + d3;
            log += `三位求和：${d1}+${d2}+${d3} = ${finalNum} → 最终数\n\n`;

            // 步骤8：根据最终数判断基础形态 baseType
            let baseType;
            if (finalNum >= 10) {
                // 大于等于10
                baseType = finalNum % 2 === 1 ? '大单' : '大双';
            } else {
                // 小于10
                baseType = finalNum % 2 === 1 ? '小单' : '小双';
            }
            log += `【步骤8 判断基础形态】最终数${finalNum} ${finalNum >=10 ? '≥10' : '<10'}、${finalNum%2===1?'单数':'双数'} → 基础形态：${baseType}\n\n`;

            // ========== 第二步：对应三门（已按你新规则替换THREE_DOORS） ==========
            const threeDoors = THREE_DOORS[baseType];
            log += `【第二步 匹配三门规则】基础形态${baseType}对应三门：${threeDoors.join('、')}\n\n`;

            // ========== 第三步 原有独家杀组公式不变（保留你原有杀组逻辑） ==========
            log += `【第三步 独家杀组公式运算】第三期号码三位数 ÷10 ÷ 最新期号码三位数 ÷ 5π（取小数点后前三位求和）\n`;
            const num3 = p3[0] * 100 + p3[1] * 10 + p3[2];
            const num1 = p1[0] * 100 + p1[1] * 10 + p1[2];
            log += `第三期(p3)号码：${p3.join('+')} → 拼接三位数 ${num3}\n`;
            log += `最新期(p1)号码：${p1.join('+')} → 拼接三位数 ${num1}\n`;
            const killVal = num3 / 10 / num1 / (5 * Math.PI);
            log += `${num3} ÷ 10 ÷ ${num1} ÷ 5π = ${killVal.toFixed(12)}\n`;
            // 取小数点后前三位求和得K
            const killPiStr = String(Math.abs(killVal)).split('.')[1] || '000';
            const k1 = parseInt(killPiStr[0]) || 0;
            const k2 = parseInt(killPiStr[1]) || 0;
            const k3 = parseInt(killPiStr[2]) || 0;
            const K = k1 + k2 + k3;
            log += `小数点后前三位：${k1}、${k2}、${k3}\n求和 K = ${k1}+${k2}+${k3} = ${K}\n`;
            // K值映射杀组
            const killType = NUM_TO_TYPE[Math.min(K, 27)];
            log += `K值${K}对应原始杀组：${killType}\n\n`;

            // ========== 第四步：杀组匹配与最终双组 ==========
            log += `【第四步 杀组匹配】\n`;
            let effectiveKill = killType;
            let isTransformed = false;
            if (!threeDoors.includes(killType)) {
                effectiveKill = KILL_TRANS_MAP[killType] || killType;
                isTransformed = true;
                log += `原始杀组「${killType}」不在三门中，按规则转换：杀${killType} = 杀${effectiveKill}\n`;
            } else {
                log += `原始杀组「${killType}」在三门中，直接排除\n`;
            }
            let finalRecs = threeDoors.filter(t => t !== effectiveKill);
            // 最终容错兜底
            if (finalRecs.length < 2) finalRecs = threeDoors.slice(0, 2);
            log += `最终双组推荐：${finalRecs.join('、')}\n\n`;

            // ========== 第五步：特码四码 ==========
            const specials = generateSpecialCodes(finalNum, finalRecs);
            log += `【第五步 特码四码】月之眼分组筛选：${specials.join('、')}`;

            return {
                log,
                baseType,
                threeDoors,
                killType,
                effectiveKill,
                isTransformed,
                finalRecs,
                S: finalNum, // 替换原S为新算法最终数
                K,
                specials: specials.slice(0, 4)
            };
        }

        // ========== 全局状态 ==========
        let lotteryHistory = [];
        let latestData = null;
        let predictHistory = [];
        let countdownInterval = null;
        let autoRefreshTimer = null;
        let isRequesting = false;
        function loadHistory() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) predictHistory = JSON.parse(saved);
            } catch(e) {}
            renderHistory();
            updateHitRate();
        }
        function saveHistory() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(predictHistory));
        }
        function renderHistory() {
            const container = $('historyBody');
            if (!predictHistory.length) {
                container.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-pink-400">暂无验证记录</td></tr>';
                return;
            }
            let html = '';
            predictHistory.slice(0, 20).forEach(r => {
                const killStatus = r.killHit ? '🀄️🈵' : (r.killHit === false ? '🍉🍉' : '--');
                const doubleStatus = r.doubleHit ? '🀄️🈵' : (r.doubleHit === false ? '🍉🍉' : '--');
                html += `
                    <tr class="border-t border-pink-200">
                        <td class="py-3 px-2 font-medium text-gray-700">${r.period}</td>
                        <td class="py-3 px-2 text-gray-600">${r.openResult || '--'}</td>
                        <td class="py-3 px-2 text-gray-600">${r.kill}</td>
                        <td class="py-3 px-2 text-gray-600">${r.recommend.join(' / ')}</td>
                        <td class="py-3 px-2 text-center">${killStatus}</td>
                        <td class="py-3 px-2 text-center">${doubleStatus}</td>
                        <td class="py-3 px-2 text-center text-pink-500 cursor-pointer" onclick="showLog('${r.period}')">查看</td>
                    </tr>
                `;
            });
            container.innerHTML = html;
        }
        function updateHitRate() {
            const verified = predictHistory.filter(r => r.killHit !== undefined && r.doubleHit !== undefined);
            if (!verified.length) {
                $('doubleHitRateDisplay').textContent = '--%';
                $('killHitRateDisplay').textContent = '--%';
                return;
            }
            const killHits = verified.filter(r => r.killHit).length;
            const doubleHits = verified.filter(r => r.doubleHit).length;
            $('killHitRateDisplay').textContent = `${Math.round(killHits / verified.length * 100)}%`;
            $('doubleHitRateDisplay').textContent = `${Math.round(doubleHits / verified.length * 100)}%`;
        }
        function savePrediction(record) {
            const idx = predictHistory.findIndex(p => p.period === record.period);
            if (idx !== -1) predictHistory[idx] = { ...predictHistory[idx], ...record };
            else predictHistory.unshift(record);
            if (predictHistory.length > 50) predictHistory.pop();
            saveHistory();
            renderHistory();
            updateHitRate();
        }
        async function verifyHistory() {
            if (!lotteryHistory.length) return;
            let changed = false;
            for (let r of predictHistory) {
                if (r.killHit !== undefined) continue;
                const open = lotteryHistory.find(d => d.expect === r.period);
                if (open) {
                    const sum = sumOfCode(open.opencode);
                    const openType = getTypeFromSum(sum);
                    r.openResult = open.opencode;
                    r.killHit = openType !== r.kill;
                    r.doubleHit = r.recommend.includes(openType);
                    changed = true;
                }
            }
            if (changed) {
                saveHistory();
                renderHistory();
                updateHitRate();
            }
        }
        function sumOfCode(opencode) {
            return String(opencode).split(',').map(Number).reduce((a, b) => a + b, 0);
        }
        function runPrediction() {
            if (!latestData || lotteryHistory.length < 3) {
                alert('历史数据不足3期，请稍后再试');
                return;
            }
            const threePeriods = lotteryHistory.slice(0,3).map(item => 
                item.opencode.split(',').map(Number)
            );
            
            const algoResult = tianzhenAlgorithm(threePeriods);
            const { log, killType, finalRecs, specials, baseType, isTransformed } = algoResult;
            
            $('doubleMain').textContent = finalRecs[0];
            $('doubleSecond').textContent = finalRecs[1];
            $('killTypeDisplay').textContent = killType;
            $('ruleTypeDisplay').textContent = baseType;
            $('algoStepsBody').textContent = `=== 禧少杀组·全新自定义封禁三门算法 ===\n输入三期号码：${threePeriods.map(p=>p.join('+')).join(' / ')}\n\n${log}`;
            
            // 杀组转换标记
            $('killTransBadge').classList.toggle('hidden', !isTransformed);
            
            renderSpecialCodes(specials);
            const nextPeriod = String(Number(latestData.period) + 1);
            savePrediction({
                period: nextPeriod,
                kill: killType,
                recommend: finalRecs,
                special: specials,
                log: log,
                openResult: null,
                killHit: undefined,
                doubleHit: undefined
            });
        }
        function renderSpecialCodes(codes) {
            const container = $('specialCodesContainer');
            container.innerHTML = '';
            codes.forEach((code, idx) => {
                const ball = document.createElement('div');
                ball.className = `w-14 h-14 rounded-full bg-gradient-to-br ${idx % 2 === 0 ? 'from-primary to-primaryDeep' : 'from-success to-emerald-600'} flex items-center justify-center text-white text-xl font-bold ball-glass animate-float hover-scale-ios`;
                ball.style.animationDelay = `${idx * 0.15}s`;
                ball.textContent = String(code).padStart(2, '0');
                container.appendChild(ball);
            });
        }
        async function fetchLotteryData(showTip = false) {
            if (isRequesting) return false;
            isRequesting = true;
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if (json.code === 1 && Array.isArray(json.data) && json.data.length > 0) {
                    lotteryHistory = json.data.slice(0, 30);
                    const latest = lotteryHistory[0];
                    const nums = latest.opencode.split(',').map(Number);
                    latestData = {
                        period: latest.expect,
                        nums: nums,
                        sum: nums.reduce((a, b) => a + b, 0),
                        opencode: latest.opencode,
                        opentime: latest.opentime
                    };
                    updateLatestUI();
                    await verifyHistory();
                    if (lotteryHistory.length >= 3) runPrediction();
                    return true;
                } else throw new Error();
            } catch(e) {
                if (showTip) alert('数据刷新失败，请检查网络');
                return false;
            } finally {
                isRequesting = false;
            }
        }
        function updateLatestUI() {
            $('ball1').textContent = latestData.nums[0];
            $('ball2').textContent = latestData.nums[1];
            $('ball3').textContent = latestData.nums[2];
            $('latestPeriodDisplay').textContent = latestData.period + '期';
            $('latestSumValue').textContent = latestData.sum;
            $('latestTypeValue').textContent = getTypeFromSum(latestData.sum);
            
            const openDate = new Date(latestData.opentime * 1000);
            $('openTimeDisplay').textContent = `${openDate.getHours().toString().padStart(2,'0')}:${openDate.getMinutes().toString().padStart(2,'0')}`;
            updateCountdown();
        }
        function updateCountdown() {
            if (!latestData.opentime) return;
            if (countdownInterval) clearInterval(countdownInterval);
            
            const nextOpen = (latestData.opentime + PERIOD_INTERVAL) * 1000;
            const update = () => {
                const diff = nextOpen - Date.now();
                if (diff <= 0) {
                    $('countdown-text').textContent = '00:00';
                    $('progress-ring').style.strokeDashoffset = RING_CIRCUMFERENCE;
                    fetchLotteryData();
                    return;
                }
                const min = Math.floor(diff / 60000);
                const sec = Math.floor((diff % 60000) / 1000);
                $('countdown-text').textContent = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                const progress = diff / (PERIOD_INTERVAL * 1000);
                $('progress-ring').style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
            };
            update();
            countdownInterval = setInterval(update, 1000);
        }
        function startAutoRefresh() {
            autoRefreshTimer = setInterval(() => fetchLotteryData(), AUTO_REFRESH_INTERVAL);
        }
        // 事件绑定
        const algoHeader = $('algoStepsHeader');
        const algoContent = $('algoStepsContent');
        const algoArrow = $('algoStepsArrow');
        algoHeader?.addEventListener('click', ()=>{
            if(algoContent.style.maxHeight === '0px'){
                algoContent.style.maxHeight = '650px';
                algoArrow.style.transform = 'rotate(180deg)'
            }else{
                algoContent.style.maxHeight = '0px';
                algoArrow.style.transform = 'rotate(0deg)'
            }
        });
        $('themeBtn')?.addEventListener('click',()=>{
            document.body.classList.toggle('dark');
            const icon = $('themeBtn').querySelector('i');
            icon.className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });
        $('refreshBtn')?.addEventListener('click', () => fetchLotteryData(true));
        $('clearHistoryBtn')?.addEventListener('click', () => {
            if(confirm('确定清空所有验证记录吗？')){
                predictHistory = [];
                saveHistory();
                renderHistory();
                updateHitRate();
            }
        });
        window.showLog = (period) => {
            const record = predictHistory.find(r => r.period === period);
            if(record) alert(`期号：${period}\n\n运算日志：\n${record.log}`);
        };
        // 初始化
        loadHistory();
        fetchLotteryData().then(startAutoRefresh);
    </script>
</body>
</html>
