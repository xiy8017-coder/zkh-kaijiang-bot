<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>小濠国际杀组</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Microsoft YaHei",sans-serif;
  color:#17233b;
}

body{
  min-height:100vh;
  background:
    linear-gradient(
      rgba(255,255,255,.48),
      rgba(255,255,255,.48)
    ),
    url("background.jpeg") center/cover fixed no-repeat;
  overflow-x:hidden;
}

/* 樱花 */
#sakura{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:5;
}

.petal{
  position:absolute;
  top:-40px;
  width:13px;
  height:9px;
  background:rgba(255,170,195,.88);
  border-radius:80% 20% 80% 20%;
  filter:drop-shadow(0 1px 2px rgba(255,100,150,.25));
  animation:fall linear infinite;
}

@keyframes fall{
  0%{
    transform:translate3d(0,-40px,0) rotate(0deg);
    opacity:0;
  }

  10%{
    opacity:.95;
  }

  50%{
    transform:translate3d(70px,50vh,0) rotate(180deg);
  }

  100%{
    transform:translate3d(-80px,110vh,0) rotate(360deg);
    opacity:0;
  }
}

.wrap{
  position:relative;
  z-index:2;
  width:min(1100px,94%);
  margin:0 auto;
  padding:25px 0 50px;
}

.header{
  text-align:center;
  padding:18px 15px 22px;
}

.logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:72px;
  height:72px;
  border-radius:50%;
  background:rgba(255,255,255,.82);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  font-size:25px;
  font-weight:900;
  color:#2864bd;
}

h1{
  margin:12px 0 6px;
  font-size:30px;
  letter-spacing:2px;
}

.subtitle{
  color:#60708b;
  font-size:14px;
}

.card{
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(31,55,90,.14);
  overflow:hidden;
  margin-bottom:18px;
}

.latest{
  padding:22px;
}

.latest-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.latest-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.info{
  background:rgba(245,248,253,.75);
  border-radius:15px;
  padding:15px;
}

.label{
  font-size:12px;
  color:#71809a;
  margin-bottom:7px;
}

.value{
  font-size:18px;
  font-weight:800;
}

.countdown{
  color:#2764bf;
  font-size:25px;
  letter-spacing:1px;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:18px;
}

.nav button{
  border:1px solid #d5dfed;
  background:rgba(255,255,255,.8);
  color:#26354d;
  padding:10px 18px;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
}

.nav button.active{
  background:#316bc5;
  color:#fff;
  border-color:#316bc5;
}

.section-title{
  padding:20px 20px 5px;
  font-size:21px;
  font-weight:900;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

th{
  background:rgba(245,248,252,.88);
  color:#65748c;
  font-size:14px;
  padding:15px 10px;
}

td{
  padding:14px 10px;
  text-align:center;
  border-top:1px solid rgba(215,224,236,.7);
  font-size:14px;
}

.group{
  display:inline-block;
  padding:7px 13px;
  background:#316bc5;
  color:#fff;
  border-radius:9px;
  font-weight:800;
}

.pending{
  color:#65748c;
  font-weight:700;
}

.ok{
  color:#28a052;
  font-weight:900;
}

.footer{
  text-align:center;
  color:#71809a;
  font-size:12px;
  line-height:1.8;
  padding:18px;
}

@media(max-width:600px){

  .wrap{
    width:94%;
    padding-top:12px;
  }

  h1{
    font-size:26px;
  }

  .latest-grid{
    grid-template-columns:1fr 1fr;
  }

  .value{
    font-size:16px;
  }

  .countdown{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div id="sakura"></div>

<div class="wrap">

  <div class="header">

    <div class="logo">
      ZKH
    </div>

    <h1>小濠国际杀组</h1>

    <div class="subtitle">
      🇨🇦 加拿大28 · 实时开奖数据中心
    </div>

  </div>


  <!-- 实时开奖 -->

  <div class="card latest">

    <div class="latest-title">
      🎯 实时开奖
    </div>

    <div class="latest-grid">

      <div class="info">
        <div class="label">当前期</div>
        <div class="value" id="issue">
          加载中...
        </div>
      </div>

      <div class="info">
        <div class="label">当前开奖号码</div>
        <div class="value" id="number">
          --
        </div>
      </div>

      <div class="info">
        <div class="label">本期组合</div>
        <div class="value" id="combination">
          --
        </div>
      </div>

      <div class="info">
        <div class="label">距离下一期开奖</div>
        <div class="value countdown" id="countdown">
          --:--
        </div>
      </div>

    </div>

  </div>


  <!-- 功能按钮 -->

  <div class="card">

    <div class="nav">

      <button
        class="active"
        onclick="showPage('latest',this)">
        最新开奖
      </button>

      <button
        onclick="showPage('trend',this)">
        近期走势
      </button>

      <button
        onclick="showPage('history',this)">
        历史开奖
      </button>

      <button
        onclick="showPage('kill',this)">
        杀组
      </button>

      <button
        onclick="showPage('stats',this)">
        统计
      </button>

      <button
        onclick="showPage('miss',this)">
        遗漏
      </button>

    </div>

  </div>


  <!-- 杀组 -->

  <div class="card" id="killPage">

    <div class="section-title">
      🔵 杀组
    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>期号</th>
            <th>时间</th>
            <th>杀组</th>
            <th>号码</th>
            <th>结果</th>
            <th>状态</th>
          </tr>

        </thead>

        <tbody id="killBody">

          <tr>
            <td colspan="6">
              正在加载数据...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

    <div class="footer">
      杀组页面按照历史开奖数据展示对应组别。
    </div>

  </div>


  <div class="card">

    <div class="footer">
      本页面展示实时开奖结果及历史统计数据。<br>
      数据仅用于开奖结果查询及历史数据展示。
    </div>

  </div>

</div>


<script>

/* =========================
   樱花
========================= */

function createSakura(){

  const box=document.getElementById("sakura");

  for(let i=0;i<28;i++){

    const p=document.createElement("div");

    p.className="petal";

    p.style.left=Math.random()*100+"%";

    p.style.animationDuration=
      (7+Math.random()*8)+"s";

    p.style.animationDelay=
      (-Math.random()*12)+"s";

    const size=7+Math.random()*10;

    p.style.width=size+"px";

    p.style.height=(size*.7)+"px";

    box.appendChild(p);
  }
}

createSakura();


/* =========================
   API
========================= */

let data=[];

let latest=null;

let countdownSeconds=0;


async function getData(n=30){

  const r=await fetch(
    "/api/kj.json?nbr="+n,
    {
      cache:"no-store"
    }
  );

  if(!r.ok){

    throw new Error("API "+r.status);

  }

  return await r.json();

}


/* =========================
   组合
========================= */

function getCombination(x){

  if(x.combination){

    return x.combination;

  }

  const num=Number(x.number);

  if(!Number.isFinite(num)){

    return "--";

  }

  const size=num>=14?"大":"小";

  const parity=num%2===0?"双":"单";

  return size+parity;

}


/* =========================
   杀组
========================= */

function getKillGroup(x){

  const c=getCombination(x);

  if(c==="大单") return "杀大单";

  if(c==="大双") return "杀大双";

  if(c==="小单") return "杀小单";

  if(c==="小双") return "杀小双";

  return "杀"+c;

}


/* =========================
   最新开奖
========================= */

function renderLatest(){

  if(!latest) return;

  document.getElementById("issue").textContent=
    latest.issue ||
    latest.nbr ||
    latest.period ||
    "--";

  document.getElementById("number").textContent=
    latest.number ||
    "--";

  document.getElementById("combination").textContent=
    getCombination(latest);

}


/* =========================
   倒计时
========================= */

function setupCountdown(){

  if(!latest) return;


  if(latest.countdown!=null){

    let c=String(latest.countdown);

    const parts=c.split(":");

    if(parts.length===2){

      countdownSeconds=
        Number(parts[0])*60+
        Number(parts[1]);

    }else{

      countdownSeconds=
        Number(c)||0;

    }

  }else if(latest.time){

    const t=new Date(
      String(latest.time)
      .replace(" ","T")
    ).getTime();

    if(!Number.isNaN(t)){

      const next=t+210000;

      countdownSeconds=
        Math.max(
          0,
          Math.floor(
            (next-Date.now())/1000
          )
        );

    }

  }

  updateCountdown();

}


function updateCountdown(){

  const el=
    document.getElementById("countdown");

  let sec=Math.max(
    0,
    countdownSeconds
  );

  const m=Math.floor(sec/60);

  const s=sec%60;

  el.textContent=
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0");

}


setInterval(()=>{

  if(countdownSeconds>0){

    countdownSeconds--;

  }

  updateCountdown();

},1000);


/* =========================
   杀组表格
========================= */

function renderKill(){

  const body=
    document.getElementById("killBody");


  if(!data.length){

    body.innerHTML=
      '<tr><td colspan="6">暂无数据</td></tr>';

    return;

  }


  body.innerHTML=data.map((x,i)=>{

    const isLatest=i===0;

    const issue=
      x.issue ||
      x.nbr ||
      x.period ||
      "--";

    const time=
      x.time ||
      "--";

    const number=
      x.number ||
      "--";

    const group=
      getKillGroup(x);


    if(isLatest){

      return `

        <tr>

          <td>${issue}</td>

          <td>
            <b>${formatCountdown()}</b>
          </td>

          <td>
            <span class="group">
              ${group}
            </span>
          </td>

          <td class="pending">
            等待开奖
          </td>

          <td>—</td>

          <td>◷</td>

        </tr>

      `;

    }


    return `

      <tr>

        <td>${issue}</td>

        <td>${time}</td>

        <td>
          <span class="group">
            ${group}
          </span>
        </td>

        <td>
          <b>${number}</b>
        </td>

        <td class="ok">
          已开奖
        </td>

        <td class="ok">
          ✓
        </td>

      </tr>

    `;

  }).join("");

}


/* =========================
   倒计时格式
========================= */

function formatCountdown(){

  const sec=Math.max(
    0,
    countdownSeconds
  );

  const m=Math.floor(sec/60);

  const s=sec%60;

  return String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0");

}


/* =========================
   刷新
========================= */

async function refresh(){

  try{

    const result=await getData(30);

    data=
      Array.isArray(result)
      ? result
      : (
          result.data ||
          result.results ||
          result.list ||
          []
        );


    if(!Array.isArray(data)){

      data=[];

    }


    latest=data[0];

    renderLatest();

    setupCountdown();

    renderKill();


  }catch(e){

    console.log(e);

    document.getElementById("issue")
      .textContent="连接失败";

    document.getElementById("number")
      .textContent="--";

    document.getElementById("combination")
      .textContent="--";

  }

}


refresh();


/* 每5秒更新 */

setInterval(
  refresh,
  5000
);


/* =========================
   按钮
========================= */

function showPage(page,btn){

  document
    .querySelectorAll(".nav button")
    .forEach(x=>{
      x.classList.remove("active");
    });


  btn.classList.add("active");


  if(page==="kill"){

    document
      .getElementById("killPage")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  }else{

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}

</script>

</body>
</html>
