<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>濠少杀组 · 双接口版</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:16px;
    background:#f5f5f5;
    color:#111
}

.container{
    max-width:480px;
    margin:0 auto
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.08)
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:800;
    margin-bottom:4px
}

.subtitle{
    text-align:center;
    font-size:12px;
    color:#8E8E93
}

.balls{
    display:flex;
    justify-content:center;
    gap:16px;
    margin:16px 0
}

.ball{
    width:64px;
    height:64px;
    border-radius:50%;
    background:#f0f0f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800
}

.info{
    text-align:center
}

.period{
    font-size:20px;
    font-weight:700
}

.sum{
    font-size:14px;
    color:#8E8E93
}

.kill-box{
    text-align:center;
    padding:16px;
    background:rgba(255,59,48,.08);
    border-radius:12px;
    margin-top:12px
}

.kill-value{
    font-size:32px;
    font-weight:800;
    color:#FF3B30
}

.kill-label{
    font-size:12px;
    color:#8E8E93
}

.range-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin:12px 0
}

.range-btn{
    padding:6px 16px;
    border-radius:20px;
    border:1px solid #ddd;
    background:#fff;
    font-size:12px;
    cursor:pointer
}

.range-btn.active{
    background:#007AFF;
    color:#fff;
    border-color:#007AFF
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#007AFF;
    color:#fff;
    font-weight:700;
    font-size:16px;
    cursor:pointer
}

.btn:active,
.predict-btn:active,
.predict2-btn:active{
    transform:scale(.97)
}

.predict-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#e83e9f,#ff6fbd);
    color:#fff;
    font-size:17px;
    font-weight:800;
    box-shadow:0 5px 15px rgba(232,62,159,.25);
    cursor:pointer;
    margin-top:8px
}

.predict2-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#15122e,#29234f);
    color:#ffd966;
    font-size:17px;
    font-weight:800;
    box-shadow:0 5px 15px rgba(21,18,46,.25);
    cursor:pointer;
    margin-top:10px
}

.status{
    font-size:12px;
    color:#8E8E93;
    text-align:center;
    margin-top:8px
}

.api-badge{
    display:inline-block;
    padding:2px 10px;
    border-radius:12px;
    font-size:10px;
    font-weight:600
}

.api-badge.primary{
    background:#34C759;
    color:#fff
}

.api-badge.backup{
    background:#FF9500;
    color:#fff
}

.api-badge.cache{
    background:#8E8E93;
    color:#fff
}

.api-badge.fail{
    background:#FF3B30;
    color:#fff
}

table{
    width:100%;
    font-size:12px;
    border-collapse:collapse
}

th,
td{
    padding:6px 4px;
    text-align:center;
    border-bottom:1px solid #eee
}

.hit{
    color:#34C759;
    font-weight:700
}

.miss{
    color:#FF3B30
}

.kill-badge{
    background:rgba(255,59,48,.15);
    padding:2px 10px;
    border-radius:12px;
    color:#FF3B30;
    font-weight:700
}

.footer{
    text-align:center;
    font-size:11px;
    color:#8E8E93;
    margin-top:12px
}

/* 花瓣 */
#petals{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999
}

.petal{
    position:absolute;
    top:-40px;
    width:14px;
    height:10px;
    background:#ffb7c5;
    border-radius:100% 0 100% 0;
    opacity:.75;
    transform:rotate(25deg);
    filter:drop-shadow(0 1px 2px rgba(255,105,135,.15));
    animation:petalFall linear infinite
}

.petal::after{
    content:"";
    position:absolute;
    width:4px;
    height:4px;
    left:5px;
    top:3px;
    background:rgba(255,255,255,.55);
    border-radius:50%
}

@keyframes petalFall{
    0%{
        transform:translate3d(0,-40px,0) rotate(0deg)
    }

    25%{
        transform:translate3d(25px,25vh,0) rotate(90deg)
    }

    50%{
        transform:translate3d(-20px,50vh,0) rotate(180deg)
    }

    75%{
        transform:translate3d(30px,75vh,0) rotate(270deg)
    }

    100%{
        transform:translate3d(-10px,110vh,0) rotate(360deg)
    }
}
</style>
</head>

<body>

<div id="petals"></div>

<div class="container">

    <!-- 顶部 -->
    <div class="card" style="background:linear-gradient(135deg,#007AFF,#0A84FF);color:#fff;">

        <div class="title">
            🎯 濠少杀组
        </div>

        <div class="subtitle" style="color:rgba(255,255,255,.8);">
            双接口自动切换 · 本地缓存 · 离线可用
        </div>

    </div>


    <!-- 最新开奖 -->
    <div class="card">

        <div class="balls">

            <div class="ball" id="num1">-</div>

            <div class="ball" id="num2">-</div>

            <div class="ball" id="num3">-</div>

        </div>


        <div class="info">

            <div class="period" id="period">
                ----期
            </div>

            <div class="sum" id="sumInfo">
                和值：-- / --
            </div>

        </div>


        <!-- 杀组 -->
        <div class="kill-box">

            <div class="kill-label">
                ⚔️ 下期杀组
            </div>

            <div class="kill-value" id="killGroup">
                --
            </div>

        </div>


        <div class="status" id="apiStatus">
            ⏳ 加载中...
        </div>

        <div style="margin-top:8px;text-align:center;" id="apiBadge"></div>

    </div>


    <!-- 区间 -->
    <div class="card">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

            <span style="font-weight:600">
                📐 当前区间
            </span>

            <span id="currentRange" style="font-weight:700;color:#007AFF">
                0.250 ~ 0.450
            </span>

        </div>


        <div class="range-row" id="rangeBtns">

            <button class="range-btn active"
                    data-min="0.250"
                    data-max="0.450">
                0.250~0.450
            </button>

            <button class="range-btn"
                    data-min="0.300"
                    data-max="0.500">
                0.300~0.500
            </button>

            <button class="range-btn"
                    data-min="0.350"
                    data-max="0.550">
                0.350~0.550
            </button>

            <button class="range-btn"
                    data-min="0.200"
                    data-max="0.400">
                0.200~0.400
            </button>

            <button class="range-btn"
                    data-min="0.150"
                    data-max="0.350">
                0.150~0.350
            </button>

        </div>


        <!-- 刷新 -->
        <button class="btn" id="refreshBtn">
            🔄 刷新数据
        </button>


        <!-- 白虎 -->
        <button class="predict-btn"
                onclick="location.href='baihu.html'">
            🐯 白虎
        </button>


        <!-- 预测2 -->
        <button class="predict2-btn"
                onclick="location.href='prediction2.html'">
            🔮 预测2
        </button>

    </div>


    <!-- 历史 -->
    <div class="card">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

            <span style="font-weight:600">
                📊 历史回测
            </span>

            <span id="hitrateBadge"
                  style="font-size:12px;color:#8E8E93">
                --
            </span>

        </div>


        <div style="overflow-x:auto">

            <table>

                <thead>

                    <tr>
                        <th>期号</th>
                        <th>杀组</th>
                        <th>实际</th>
                        <th>结果</th>
                    </tr>

                </thead>

                <tbody id="historyBody">

                    <tr>
                        <td colspan="4">
                            加载中...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        仅供娱乐 · 数据自动同步
    </div>

</div>


<script>

/* =========================
   花瓣效果
========================= */

(function(){

    var box=document.getElementById('petals');

    if(!box)return;

    for(var i=0;i<20;i++){

        var p=document.createElement('span');

        p.className='petal';

        p.style.left=Math.random()*100+'vw';

        p.style.animationDuration=
            7+Math.random()*8+'s';

        p.style.animationDelay=
            -Math.random()*12+'s';

        p.style.opacity=
            (.45+Math.random()*.45).toFixed(2);

        box.appendChild(p);

    }

})();


/* =========================
   数据接口
========================= */

const API_PRIMARY=
    'https://kj.pc28.im/api/kj.json?nbr=1000';

const API_BACKUP=
    'https://pc28.help/api/kj.json?nbr=1000';


/* =========================
   数字处理
========================= */

function digitSum(num){

    var s=0;

    var str=String(num)
        .replace('.','')
        .replace('-','');

    for(var i=0;i<str.length;i++){

        s+=parseInt(str[i])||0;

    }

    return s;
}


function getTypeFromSum(sum){

    return (sum<14?'小':'大')
        +(sum%2===0?'双':'单');

}


/* =========================
   随机算法
========================= */

function seededRandom(seed){

    var s=seed|0;

    return function(){

        s=(s+0x9e3779b9)|0;

        var t=s^(s>>>15);

        t=Math.imul(t,0x85ebca6b);

        t=t^(t>>>13);

        t=Math.imul(t,0xc2b2ae35);

        t=t^(t>>>16);

        return(t>>>0)/4294967296;

    };

}


/* =========================
   杀组计算
========================= */

function calcKillGroup(prev,range){

    var typesOrder=[
        '小双',
        '小单',
        '大双',
        '大单'
    ];

    var period=parseInt(prev.expect);

    var rng=seededRandom(period);

    var rand=
        rng()*(range.max-range.min)+range.min;

    var product=
        rand*prev.sum;

    var rounded=
        Number(product.toFixed(3));

    var finalSum=
        digitSum(rounded);

    var baseType=
        getTypeFromSum(finalSum);

    var decStr=
        rand.toFixed(8)
        .split('.')[1]||'0';

    var first3=
        decStr
        .slice(0,3)
        .padEnd(3,'0');

    var offset=
        digitSum(first3)%4;

    var baseIdx=
        typesOrder.indexOf(baseType);

    return typesOrder[
        (baseIdx+offset)%4
    ];

}


/* =========================
   全局变量
========================= */

var lotteryHistory=[];

var currentRange={
    min:.250,
    max:.450
};

var isFetching=false;


function $(id){

    return document.getElementById(id);

}


/* =========================
   数据标准化
========================= */

function normalizeItem(item){

    var nums;

    if(Array.isArray(item.parts)){

        nums=
            item.parts.map(Number);

    }else{

        var m=
            String(item.number||'')
            .match(/\d+/g);

        nums=
            m
            ?m.slice(0,3).map(Number)
            :[];

    }


    var sum=
        item.sum!=null
        ?Number(item.sum)
        :nums.reduce(
            function(a,b){
                return a+b
            },
            0
        );


    var combination=
        item.combination
        ||getTypeFromSum(sum);


    var size=
        item.size
        ||(sum<14?'小':'大');


    var parity=
        item.parity
        ||(sum%2===0?'双':'单');


    var expect=
        item.nbr
        ||item.issue
        ||item.expect
        ||'--';


    var opentime=
        item.drawTime
        ?item.drawTime/1000
        :(item.opentime
        ||Date.now()/1000);


    return{

        expect:String(expect),

        nums:nums,

        sum:sum,

        type:combination,

        size:size,

        parity:parity,

        opentime:opentime

    };

}


/* =========================
   获取数据
========================= */

async function fetchData(){

    if(isFetching)return;

    isFetching=true;

    $('apiStatus').textContent=
        '⏳ 请求主接口...';

    $('apiBadge').innerHTML='';


    try{

        var res=
            await fetch(
                API_PRIMARY+
                '&_='+
                Date.now(),
                {
                    headers:{
                        Accept:'application/json'
                    },
                    mode:'cors',
                    cache:'no-cache'
                }
            );


        if(!res.ok){

            throw Error(
                '主接口响应异常'
            );

        }


        var json=
            await res.json();


        if(
            json&&
            Array.isArray(json.data)&&
            json.data.length
        ){

            parseData(json.data);

            $('apiStatus').textContent=
                '✅ 主接口成功 · '+
                lotteryHistory.length+
                '期';

            $('apiBadge').innerHTML=
                '<span class="api-badge primary">'+
                '主接口'+
                '</span>';

            isFetching=false;

            return;

        }


        throw Error(
            '主接口数据为空'
        );


    }catch(e){

        try{

            var res2=
                await fetch(
                    API_BACKUP+
                    '&_='+
                    Date.now(),
                    {
                        headers:{
                            Accept:'application/json'
                        },
                        mode:'cors',
                        cache:'no-cache'
                    }
                );


            if(!res2.ok){

                throw Error(
                    '备用接口响应异常'
                );

            }


            var json2=
                await res2.json();


            if(
                json2&&
                Array.isArray(json2.data)&&
                json2.data.length
            ){

                parseData(json2.data);

                $('apiStatus').textContent=
                    '🔄 备用接口成功 · '+
                    lotteryHistory.length+
                    '期';

                $('apiBadge').innerHTML=
                    '<span class="api-badge backup">'+
                    '备用接口'+
                    '</span>';

                isFetching=false;

                return;

            }


            throw Error(
                '备用接口数据为空'
            );


        }catch(e2){

            tryOffline();

        }

    }

}


/* =========================
   离线缓存
========================= */

function tryOffline(){

    var cached=
        localStorage.getItem(
            'kill_history'
        );


    if(cached){

        try{

            lotteryHistory=
                JSON.parse(cached);


            if(lotteryHistory.length){

                updateUI();

                $('apiStatus').textContent=
                    '💾 本地缓存 ('+
                    lotteryHistory.length+
                    '期)';

                $('apiBadge').innerHTML=
                    '<span class="api-badge cache">'+
                    '缓存'+
                    '</span>';

                isFetching=false;

                return;

            }

        }catch(e){}

    }


    $('apiStatus').textContent=
        '❌ 暂无可用数据';

    $('apiBadge').innerHTML=
        '<span class="api-badge fail">'+
        '失败'+
        '</span>';

    isFetching=false;

}


/* =========================
   保存数据
========================= */

function parseData(data){

    lotteryHistory=
        data
        .map(normalizeItem)
        .filter(function(x){

            return x.nums&&
                   x.nums.length>=3;

        })
        .sort(function(a,b){

            return a.opentime-b.opentime;

        });


    localStorage.setItem(
        'kill_history',
        JSON.stringify(
            lotteryHistory
        )
    );


    updateUI();

}


/* =========================
   更新页面
========================= */

function updateUI(){

    if(!lotteryHistory.length)return;


    var asc=
        lotteryHistory
        .slice()
        .sort(function(a,b){

            return a.opentime-b.opentime;

        });


    var latest=
        asc[asc.length-1];


    $('num1').textContent=
        latest.nums[0];

    $('num2').textContent=
        latest.nums[1];

    $('num3').textContent=
        latest.nums[2];


    $('period').textContent=
        latest.expect+
        '期';


    $('sumInfo').textContent=
        '和值：'+
        latest.sum+
        ' / '+
        latest.type;


    $('killGroup').textContent=
        calcKillGroup(
            latest,
            currentRange
        );


    renderBacktest(asc);

}


/* =========================
   历史回测
========================= */

function renderBacktest(asc){

    if(asc.length<2){

        $('historyBody').innerHTML=
            '<tr>'+
            '<td colspan="4">'+
            '数据不足（至少2期）'+
            '</td>'+
            '</tr>';

        $('hitrateBadge').textContent='--';

        return;

    }


    var total=
        asc.length-1;

    var start=
        Math.max(
            0,
            total-49
        );

    var rows='';

    var hitCount=0;

    var totalCount=0;


    for(
        var i=total-1;
        i>=start;
        i--
    ){

        var prev=
            asc[i];

        var cur=
            asc[i+1];


        var kill=
            calcKillGroup(
                prev,
                currentRange
            );


        var isSpecial=
            cur.sum===13||
            cur.sum===14;


        var isHit=
            isSpecial||
            cur.type!==kill;


        if(isHit){

            hitCount++;

        }


        totalCount++;


        rows+=
            '<tr>'+
            '<td>'+
            cur.expect+
            '</td>'+
            '<td>'+
            '<span class="kill-badge">'+
            kill+
            '</span>'+
            '</td>'+
            '<td>'+
            cur.nums.join('+')+
            '='+cur.sum+
            ' '+
            cur.type+
            '</td>'+
            '<td class="'+
            (isHit?'hit':'miss')+
            '">'+
            (isHit
                ?'✅ 杀中'
                :'❌ 杀错')+
            '</td>'+
            '</tr>';

    }


    $('historyBody').innerHTML=
        rows;


    var rate=
        totalCount
        ?Math.round(
            hitCount/
            totalCount*
            1000
        )/10
        :0;


    $('hitrateBadge').textContent=
        '杀组命中率 '+
        rate+
        '% ('+
        hitCount+
        '/'+
        totalCount+
        ')';

}


/* =========================
   区间
========================= */

function setRange(min,max){

    currentRange={
        min:parseFloat(min),
        max:parseFloat(max)
    };


    $('currentRange').textContent=
        min+
        ' ~ '+
        max;


    localStorage.setItem(
        'kill_range',
        JSON.stringify(
            currentRange
        )
    );


    document
        .querySelectorAll(
            '.range-btn'
        )
        .forEach(function(btn){

            btn.classList.toggle(
                'active',
                btn.dataset.min===min&&
                btn.dataset.max===max
            );

        });


    if(lotteryHistory.length){

        updateUI();

    }

}


/* =========================
   页面启动
========================= */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        var stored=
            localStorage.getItem(
                'kill_range'
            );


        if(stored){

            try{

                var r=
                    JSON.parse(stored);

                currentRange=r;


                $('currentRange').textContent=
                    r.min.toFixed(3)+
                    ' ~ '+
                    r.max.toFixed(3);


                document
                    .querySelectorAll(
                        '.range-btn'
                    )
                    .forEach(function(btn){

                        btn.classList.toggle(
                            'active',
                            parseFloat(
                                btn.dataset.min
                            )===r.min&&
                            parseFloat(
                                btn.dataset.max
                            )===r.max
                        );

                    });

            }catch(e){}

        }


        document
            .querySelectorAll(
                '.range-btn'
            )
            .forEach(function(btn){

                btn.onclick=function(){

                    setRange(
                        this.dataset.min,
                        this.dataset.max
                    );

                };

            });


        $('refreshBtn').onclick=
            fetchData;


        var cached=
            localStorage.getItem(
                'kill_history'
            );


        if(cached){

            try{

                lotteryHistory=
                    JSON.parse(cached);


                if(lotteryHistory.length){

                    updateUI();

                    $('apiStatus').textContent=
                        '💾 缓存加载，正在刷新...';

                }

            }catch(e){}

        }


        fetchData();


        setInterval(
            fetchData,
            35000
        );

    }
);

</script>

</body>
</html>
