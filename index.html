<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>小濠预测</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Microsoft YaHei",sans-serif;
  color:#17233b;
}

body{
  background:
    linear-gradient(rgba(255,239,247,.30),rgba(255,245,250,.45)),
    url("background.jpeg") center/cover fixed no-repeat;
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* 樱花 */

.sakura{
  position:fixed;
  top:-40px;
  z-index:1;
  pointer-events:none;
  animation:fall linear infinite;
  opacity:.85;
}

@keyframes fall{
  0%{
    transform:translate3d(0,-50px,0) rotate(0deg);
  }
  100%{
    transform:translate3d(100px,110vh,0) rotate(360deg);
  }
}

/* 主体 */

.app{
  position:relative;
  z-index:2;
  width:100%;
  max-width:760px;
  margin:auto;
  padding-bottom:100px;
}

/* 顶部 */

.header{
  min-height:72px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.78);
  border-bottom:1px solid rgba(190,120,150,.16);
  backdrop-filter:blur(18px);
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#e878a3,#b92c68);
  color:white;
  font-size:12px;
  font-weight:900;
  box-shadow:0 5px 18px rgba(190,50,100,.25);
  flex:none;
}

.brand{
  font-size:22px;
  font-weight:900;
  color:#a92e63;
  white-space:nowrap;
}

.header-btn{
  padding:9px 12px;
  border:1px solid #e7c6d5;
  border-radius:12px;
  background:rgba(255,255,255,.78);
  color:#a22f61;
  font-size:13px;
  white-space:nowrap;
}

.header-spacer{
  flex:1;
}

.theme{
  width:42px;
  height:42px;
  border:1px solid #e7c6d5;
  border-radius:12px;
  background:#fff;
  font-size:20px;
  flex:none;
}

/* 页面 */

.content{
  padding:18px 15px;
}

h1{
  font-size:35px;
  margin:10px 4px 18px;
  font-weight:900;
}

h1:after{
  content:"";
  display:block;
  width:38px;
  height:5px;
  border-radius:5px;
  background:#ca3e76;
  margin-top:10px;
}

/* 卡片 */

.card{
  background:rgba(255,255,255,.86);
  border:1px solid rgba(205,150,175,.32);
  border-radius:20px;
  margin-bottom:14px;
  box-shadow:0 8px 25px rgba(110,55,80,.10);
  backdrop-filter:blur(16px);
  overflow:hidden;
}

/* 倒计时 */

.countdown{
  padding:18px;
}

.count-top{
  display:flex;
  justify-content:space-between;
  color:#65738b;
  font-size:15px;
}

.clock{
  color:#bd336a;
  margin-right:5px;
}

.count-number{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin:12px 0 8px;
}

.count-bottom{
  display:flex;
  justify-content:space-between;
  color:#68758a;
  font-size:13px;
}

.progress{
  height:6px;
  border-radius:10px;
  background:#e8dfe5;
  margin-top:13px;
  overflow:hidden;
}

.progress-inner{
  height:100%;
  width:0%;
  background:#c63772;
  border-radius:10px;
  transition:width .3s;
}

/* 开奖结果 */

.result{
  padding:17px;
}

.result-head{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.issue{
  font-size:18px;
  font-weight:900;
}

.time{
  color:#718096;
  font-size:13px;
}

.result-numbers{
  display:grid;
  grid-template-columns:repeat(3,1fr) 1.05fr;
  gap:10px;
  align-items:center;
}

.num{
  height:112px;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#fff6fa,#fce7f0);
  border:1px solid #efcddc;
  font-size:48px;
  font-weight:900;
}

.total{
  height:112px;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#d94c82,#ad245b);
  color:#fff;
  font-size:47px;
  font-weight:900;
}

/* 标签 */

.tabs{
  display:flex;
  gap:9px;
  padding:14px 15px;
  border-bottom:1px solid #eadfe5;
  overflow-x:auto;
}

.tab{
  flex:none;
  padding:9px 17px;
  border:1px solid #dfcfda;
  border-radius:11px;
  background:#fff;
  font-size:14px;
  color:#317fc9;
}

.tab.active{
  background:#c63772;
  color:white;
  border-color:#c63772;
}

/* 表格 */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:620px;
}

th{
  padding:12px 7px;
  background:rgba(249,242,246,.9);
  color:#63718a;
  font-size:13px;
  text-align:center;
}

td{
  padding:11px 7px;
  border-top:1px solid #eadfe5;
  text-align:center;
  font-size:13px;
  white-space:nowrap;
}

.row-green{
  background:rgba(229,247,235,.65);
}

.row-red{
  background:rgba(253,235,238,.65);
}

.badge{
  display:inline-block;
  min-width:34px;
  padding:5px 8px;
  border-radius:8px;
  color:#fff;
  font-weight:800;
  margin:1px;
}

.big{
  background:#e94d47;
}

.small{
  background:#4b91df;
}

.single{
  background:#4b91df;
}

.double{
  background:#e94d47;
}

.shape{
  background:#e1f0e4;
  color:#3e8050;
}

/* 杀组 */

.kill-card{
  padding:18px;
}

.kill-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:15px;
}

.kill-box{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff4f9,#fff);
  border:1px solid #efd2df;
  text-align:center;
}

.kill-label{
  color:#8b92a2;
  font-size:13px;
  margin-bottom:7px;
}

.kill-value{
  display:inline-block;
  padding:10px 18px;
  border-radius:12px;
  background:#c63772;
  color:#fff;
  font-size:20px;
  font-weight:900;
}

.kill-status{
  margin-top:10px;
  color:#7c8799;
  font-size:13px;
}

.kill-history{
  margin-top:15px;
  border-top:1px solid #eadfe5;
}

.kill-history-row{
  display:flex;
  justify-content:space-between;
  padding:12px 2px;
  border-bottom:1px solid #eee4e9;
  font-size:13px;
}

.kill-history-row:last-child{
  border-bottom:0;
}

.kill-history-row b{
  color:#b63769;
}

/* AI */

.ai{
  padding:18px;
}

.ai-title{
  font-size:19px;
  font-weight:900;
  margin-bottom:12px;
}

.ai-box{
  padding:15px;
  border-radius:14px;
  background:linear-gradient(135deg,#fff5fa,#fff);
  border:1px solid #efd5e1;
  line-height:1.8;
  font-size:14px;
}

/* 底部 */

.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  height:72px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(255,255,255,.91);
  border-top:1px solid #eadce4;
  backdrop-filter:blur(20px);
  z-index:20;
}

.nav{
  width:25%;
  text-align:center;
  color:#68758a;
  font-size:11px;
  cursor:pointer;
  user-select:none;
}

.nav-icon{
  font-size:23px;
  margin-bottom:3px;
}

.nav.active{
  color:#c63772;
  font-weight:800;
}

.footer{
  text-align:center;
  color:#9a6479;
  font-size:12px;
  padding:12px;
}

/* 深色 */

.dark-mode{
  filter:brightness(.78);
}

/* 手机 */

@media(max-width:600px){

  .header{
    padding:12px 10px;
    gap:7px;
  }

  .logo{
    width:45px;
    height:45px;
  }

  .brand{
    font-size:20px;
  }

  .header-btn{
    font-size:11px;
    padding:8px 7px;
  }

  .theme{
    width:38px;
    height:38px;
  }

  .content{
    padding:14px 10px;
  }

  h1{
    font-size:32px;
  }

  .num,
  .total{
    height:90px;
    font-size:38px;
  }

  .result-numbers{
    gap:7px;
  }

  .count-number{
    font-size:38px;
  }
}
</style>
</head>

<body>

<div id="sakura"></div>

<div class="app">

<header class="header">

<script>

/* =========================
   樱花
========================= */

const sakuraBox =
  document.getElementById("sakura");

for(let i=0;i<12;i++){

  const el =
    document.createElement("div");

  el.className = "sakura";

  el.innerText = "🌸";

  el.style.left =
    Math.random()*100+"%";

  el.style.fontSize =
    (12+Math.random()*13)+"px";

  el.style.animationDuration =
    (7+Math.random()*8)+"s";

  el.style.animationDelay =
    (-Math.random()*10)+"s";

  sakuraBox.appendChild(el);
}


/* =========================
   数据变量
========================= */

let draws = [];

let countdownSeconds = 0;

let nextIssueNumber = "--";

let nextOpenTime = null;


/* =========================
   找开奖数组
========================= */

function findArray(obj){

  if(Array.isArray(obj))
    return obj;

  if(!obj || typeof obj!=="object")
    return null;

  const keys = [
    "data",
    "list",
    "result",
    "items",
    "rows",
    "records"
  ];

  for(const key of keys){

    if(Array.isArray(obj[key]))
      return obj[key];

  }

  for(const key of keys){

    if(
      obj[key] &&
      typeof obj[key]==="object"
    ){

      const found =
        findArray(obj[key]);

      if(found)
        return found;

    }

  }

  return null;
}


/* =========================
   期号
   YU28 官方字段：nbr
========================= */

function issueOf(x){

  if(!x || typeof x!=="object")
    return "--";

  return String(
    x.nbr ??
    x.issue ??
    x.period ??
    x.expect ??
    x.qh ??
    x.issueNo ??
    x.number_id ??
    x.no ??
    "--"
  );
}


/* =========================
   时间
========================= */

function timeOf(x){

  if(!x || typeof x!=="object")
    return "";

  return (
    x.time ??
    x.open_time ??
    x.openTime ??
    x.date ??
    x.datetime ??
    x.openDateTime ??
    ""
  );
}


/* =========================
   号码
   YU28 官方字段：
   number = 4+8+2=14
========================= */

function numbersOf(x){

  if(!x || typeof x!=="object")
    return ["-","-","-"];

  let raw =
    x.number ??
    x.numbers ??
    x.code ??
    x.open_code ??
    x.openCode ??
    "";

  if(Array.isArray(raw)){

    const arr =
      raw
      .map(Number)
      .filter(n=>!isNaN(n));

    if(arr.length>=3)
      return arr.slice(0,3);
  }

  const m =
    String(raw).match(/\d+/g);

  if(m && m.length>=3){

    return m
      .slice(0,3)
      .map(Number);
  }

  const direct = [
    x.n1,
    x.n2,
    x.n3
  ]
  .map(Number)
  .filter(n=>!isNaN(n));

  if(direct.length===3)
    return direct;

  return ["-","-","-"];
}


/* =========================
   和值
========================= */

function sumOf(x){

  if(!x || typeof x!=="object")
    return 0;

  if(
    x.sum!==undefined &&
    !isNaN(Number(x.sum))
  )
    return Number(x.sum);

  if(
    x.total!==undefined &&
    !isNaN(Number(x.total))
  )
    return Number(x.total);

  const raw =
    x.number ?? "";

  const m =
    String(raw).match(/\d+/g);

  if(m && m.length>=4){

    const officialSum =
      Number(m[3]);

    if(!isNaN(officialSum))
      return officialSum;
  }

  const nums =
    numbersOf(x)
    .map(Number)
    .filter(n=>!isNaN(n));

  if(nums.length===3)
    return nums[0]+nums[1]+nums[2];

  return 0;
}


/* =========================
   大小单双
========================= */

function sizeOf(sum){

  return Number(sum)>=14
    ? "大"
    : "小";
}


function parityOf(sum){

  return Number(sum)%2===0
    ? "双"
    : "单";
}


function comboOf(sum){

  return sizeOf(sum)+parityOf(sum);
}


/* =========================
   形态
========================= */

function shapeOf(nums){

  const a =
    nums.map(Number);

  if(
    a.length!==3 ||
    a.some(isNaN)
  )
    return "--";

  if(
    a[0]===a[1] &&
    a[1]===a[2]
  )
    return "豹子";

  if(
    a[0]===a[1] ||
    a[0]===a[2] ||
    a[1]===a[2]
  )
    return "组三";

  return "杂六";
}


/* =========================
   倒计时
   YU28 官方：
   countdown = MM:SS
========================= */

function findCountdown(obj){

  if(!obj || typeof obj!=="object")
    return null;

  const keys = [
    "countdown",
    "next_countdown",
    "nextCountdown",
    "remain",
    "remaining",
    "seconds"
  ];

  for(const key of keys){

    if(obj[key]!==undefined){

      const value = obj[key];

      if(typeof value==="number")
        return value;

      if(typeof value==="string"){

        let m =
          value.match(
            /^(\d+):(\d+):(\d+)$/
          );

        if(m){

          return (
            Number(m[1])*3600 +
            Number(m[2])*60 +
            Number(m[3])
          );
        }

        m =
          value.match(
            /^(\d+):(\d+)$/
          );

        if(m){

          return (
            Number(m[1])*60 +
            Number(m[2])
          );
        }

        if(!isNaN(Number(value)))
          return Number(value);
      }
    }
  }

  return null;
}


/* =========================
   下一期期号
========================= */

function calculateNextIssue(){

  if(!draws.length)
    return "--";

  const current =
    issueOf(draws[0]);

  const n =
    parseInt(
      String(current).replace(/\D/g,""),
      10
    );

  if(!isNaN(n))
    return String(n+1);

  return "--";
}


/* =========================
   计算下一期开奖时间
========================= */

function calculateNextTime(){

  if(!draws.length)
    return null;

  const currentTime =
    timeOf(draws[0]);

  if(!currentTime)
    return null;

  const m =
    String(currentTime).match(
      /(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/
    );

  if(!m)
    return null;

  const base =
    new Date(
      Number(m[1]),
      Number(m[2])-1,
      Number(m[3]),
      Number(m[4]),
      Number(m[5]),
      Number(m[6] || 0)
    );

  if(isNaN(base.getTime()))
    return null;

  base.setSeconds(
    base.getSeconds()+countdownSeconds
  );

  const hh =
    String(base.getHours()).padStart(2,"0");

  const mm =
    String(base.getMinutes()).padStart(2,"0");

  const ss =
    String(base.getSeconds()).padStart(2,"0");

  return hh+":"+mm+":"+ss;
}


/* =========================
   格式化时间
========================= */

function formatTime(t){

  if(!t)
    return "--:--:--";

  const s =
    String(t);

  const m =
    s.match(
      /(\d{1,2}):(\d{2})(?::(\d{2}))?/
    );

  if(m){

    return (
      String(m[1]).padStart(2,"0")+
      ":"+
      m[2]+
      ":"+
      (m[3] || "00")
    );
  }

  return s;
}


/* =========================
   加载 YU28 数据
========================= */

async function loadData(){

  try{

    const res =
      await fetch(
        "/api/kj.json?nbr=57&_="+Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!res.ok){

      throw new Error(
        "API "+res.status
      );
    }

    const json =
      await res.json();

    console.log(
      "YU28同步:",
      json
    );

    const list =
      findArray(json);

    if(
      !list ||
      !list.length
    ){

      throw new Error(
        "没有找到开奖数据"
      );
    }

    draws =
      list.slice(0,57);

    /* 倒计时 */

    const cd =
      findCountdown(json);

    if(cd!==null){

      countdownSeconds =
        Math.max(
          0,
          Math.floor(
            Number(cd)
          )
        );
    }

    /* 下一期 */

    nextIssueNumber =
      calculateNextIssue();

    /* 下一期开奖时间 */

    nextOpenTime =
      calculateNextTime();

    updatePage();

  }catch(error){

    console.error(
      "同步失败:",
      error
    );

    document.getElementById(
      "aiText"
    ).innerHTML =
      "⚠️ 正在重新连接实时开奖数据……";
  }
}


/* =========================
   更新页面
========================= */

function updatePage(){

  if(!draws.length)
    return;

  const first =
    draws[0];

  const issue =
    issueOf(first);

  const nums =
    numbersOf(first);

  const sum =
    sumOf(first);

  /* 当前期 */

  document.getElementById(
    "currentIssue"
  ).innerText =
    "第"+issue+"期";

  document.getElementById(
    "currentTime"
  ).innerText =
    timeOf(first) || "--";

  document.getElementById(
    "n1"
  ).innerText =
    nums[0];

  document.getElementById(
    "n2"
  ).innerText =
    nums[1];

  document.getElementById(
    "n3"
  ).innerText =
    nums[2];

  document.getElementById(
    "sum"
  ).innerText =
    sum > 0 ? sum : "-";

  /* 下一期 */

  document.getElementById(
    "nextIssue"
  ).innerText =
    "第 "+nextIssueNumber+" 期";

  /* 杀组 */

  document.getElementById(
    "killLatest"
  ).innerText =
    "第 "+issue+" 期";

  document.getElementById(
    "killStatus"
  ).innerText =
    "第 "+nextIssueNumber+
    " 期 · 等待开奖";

  /* 下一期开奖时间 */

  if(nextOpenTime){

    document.getElementById(
      "nextTime"
    ).innerText =
      "开奖 "+
      formatTime(nextOpenTime);

  }else{

    document.getElementById(
      "nextTime"
    ).innerText =
      "等待开奖";
  }

  renderTable();

  renderAI();

  renderCountdown();
}


/* =========================
   表格
========================= */

function renderTable(){

  const body =
    document.getElementById(
      "drawTable"
    );

  body.innerHTML = "";

  draws.forEach(
    (item,index)=>{

      const issue =
        issueOf(item);

      const time =
        timeOf(item);

      const nums =
        numbersOf(item);

      const sum =
        sumOf(item);

      const size =
        sizeOf(sum);

      const parity =
        parityOf(sum);

      const shape =
        shapeOf(nums);

      const tr =
        document.createElement("tr");

      tr.className =
        index%2===0
        ? "row-green"
        : "row-red";

      tr.innerHTML = `

        <td>
          <b>${issue}</b>
        </td>

        <td>
          ${time || "--"}
        </td>

        <td>
          ${nums[0]} + ${nums[1]} + ${nums[2]}
          = <b>${sum}</b>
        </td>

        <td>

          <span class="badge ${
            size==="大"
              ? "big"
              : "small"
          }">
            ${size}
          </span>

          <span class="badge ${
            parity==="单"
              ? "single"
              : "double"
          }">
            ${parity}
          </span>

        </td>

        <td>

          <span class="badge shape">
            ${shape}
          </span>

        </td>

      `;

      body.appendChild(tr);

    }
  );
}


/* =========================
   AI历史统计
========================= */

function renderAI(){

  const sums =
    draws
    .map(x=>sumOf(x))
    .filter(x=>x>0);

  if(!sums.length)
    return;

  const avg =
    sums.reduce(
      (a,b)=>a+b,
      0
    )/sums.length;

  const big =
    sums.filter(
      x=>x>=14
    ).length;

  const small =
    sums.length-big;

  const odd =
    sums.filter(
      x=>x%2!==0
    ).length;

  const even =
    sums.length-odd;

  const max =
    Math.max(...sums);

  const min =
    Math.min(...sums);

  document.getElementById(
    "aiText"
  ).innerHTML = `

    当前同步：
    <b>最近 ${sums.length} 期</b>

    <br>

    和值范围：
    <b>${min} ～ ${max}</b>

    <br>

    平均和值：
    <b>${avg.toFixed(1)}</b>

    <br>

    大和值：
    <b>${big}期</b>
    　小和值：
    <b>${small}期</b>

    <br>

    单数和值：
    <b>${odd}期</b>
    　双数和值：
    <b>${even}期</b>

    <br><br>

    页面正在实时同步已经开奖的数据。
    新一期开奖后，历史统计会自动重新计算。

    <br><br>

    <span style="color:#b63769">
      ⚠️ 仅供娱乐，切勿牟利
    </span>

  `;
}


/* =========================
   倒计时显示
========================= */

function renderCountdown(){

  const sec =
    Math.max(
      0,
      Math.floor(
        countdownSeconds
      )
    );

  const min =
    Math.floor(sec/60);

  const s =
    sec%60;

  document.getElementById(
    "countdown"
  ).innerText =
    min+
    "分"+
    String(s).padStart(2,"0")+
    "秒";

  const progress =
    document.getElementById(
      "progress"
    );

  const percent =
    Math.min(
      100,
      Math.max(
        0,
        100-
        sec/210*100
      )
    );

  progress.style.width =
    percent+"%";
}


/* =========================
   每秒倒计时
========================= */

setInterval(
  ()=>{

    if(countdownSeconds>0){

      countdownSeconds--;

      renderCountdown();

      nextOpenTime =
        calculateNextTime();

      if(nextOpenTime){

        document.getElementById(
          "nextTime"
        ).innerText =
          "开奖 "+
          formatTime(nextOpenTime);
      }

    }

  },
  1000
);
