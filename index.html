}

.api-badge.backup{

}

.api-badge.cache{

}

.api-badge.fail{

table{
    width:100%;
    font-size:12px;

}

th,td{

    text-align:center;
    border-bottom:1px solid #eee;
}

.hit{
    color:#34C759;
    font-weight:700;
}

.miss{

}

.kill-badge{
    background:rgba(255,59,48,.15);
    padding:2px 10px;
    border-radius:12px;
    color:#FF3B30;
    font-weight:700;
}

.footer{
    text-align:center;
    font-size:11px;

/* =========================
   🌸 樱花飘落
   ========================= */

#petals{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
}

.petal{
    position:absolute;
    top:-40px;
    width:14px;
    height:10px;
    background:#ffb7c5;
    border-radius:100% 0 100% 0;
    opacity:.75;
    transform:rotate(25deg);
    filter:drop-shadow(0 1px 2px rgba(255,105,135,.15));
    animation:petalFall linear infinite;
}

.petal::after{
    content:"";
    position:absolute;
    width:4px;
    height:4px;
    left:5px;
    top:3px;
    background:rgba(255,255,255,.55);
    border-radius:50%;
}

@keyframes petalFall{

    0%{
        transform:translate3d(0,-40px,0) rotate(0deg);
    }

    25%{
        transform:translate3d(25px,25vh,0) rotate(90deg);
    }

    50%{
        transform:translate3d(-20px,50vh,0) rotate(180deg);
    }

    75%{
        transform:translate3d(30px,75vh,0) rotate(270deg);
    }

    100%{
        transform:translate3d(-10px,110vh,0) rotate(360deg);
    }

}

<script>

/* ============================================================
   🌸 樱花飘落
============================================================ */

(function(){

    var box = document.getElementById("petals");

    if(!box) return;

    for(var i = 0; i < 20; i++){

        box.appendChild(p);

/* ============================================================
   接口
============================================================ */

const API_PRIMARY =
    "https://kj.pc28.im/api/kj.json?nbr=1000";

const API_BACKUP =
    "https://pc28.help/api/kj.json?nbr=1000";



/* ============================================================
   工具
============================================================ */

function digitSum(num){

    var s = 0;

    var str = String(num)
        .replace(".","")
        .replace("-","");

    for(var i = 0; i < str.length; i++){

        s += parseInt(str[i]) || 0;

    }

    return s;

}



function getTypeFromSum(sum){

    var size =
        sum < 14 ? "小" : "大";

    var parity =
        sum % 2 === 0 ? "双" : "单";

    return size + parity;

}



function seededRandom(seed){

    var s = seed | 0;

    return function(){

        s =
            (s + 0x9e3779b9) | 0;

        var t =
            s ^ (s >>> 15);

        t =
            Math.imul(
                t,
                0x85ebca6b
            );

        t =
            t ^ (t >>> 13);

        t =
            Math.imul(
                t,
                0xc2b2ae35
            );

        t =
            t ^ (t >>> 16);

        return (
            (t >>> 0) /
            4294967296
        );

    };

}



/* ============================================================
   杀组计算
============================================================ */

function calcKillGroup(prev,range){

    var typesOrder = [
        "小双",
        "小单",
        "大双",
        "大单"
    ];

    var period =
        parseInt(prev.expect);

    var rng =
        seededRandom(period);

    var rand =
        rng() *
        (range.max - range.min)
        + range.min;

    var product =
        rand * prev.sum;

    var rounded =
        Number(product.toFixed(3));

    var finalSum =
        digitSum(rounded);

    var baseType =
        getTypeFromSum(finalSum);

    var decStr =
        rand
        .toFixed(8)
        .split(".")[1] || "0";

    var first3 =
        decStr
        .slice(0,3)
        .padEnd(3,"0");

    var offset =
        digitSum(first3) % 4;

    var baseIdx =
        typesOrder.indexOf(baseType);

    var killIdx =
        (baseIdx + offset) % 4;

    return typesOrder[killIdx];

}



/* ============================================================
   数据
============================================================ */

var lotteryHistory = [];

var currentRange = {
    min:0.250,
    max:0.450
};

var isFetching = false;



function $(id){

    return document.getElementById(id);

}



/* ============================================================
   数据标准化
============================================================ */

function normalizeItem(item){

    var nums;

    if(Array.isArray(item.parts)){

        nums = item.parts;

    }else{

        nums =
            String(item.number || "")
            .split("+")
            .map(Number);

    }


    var sum =
        item.sum != null
        ? Number(item.sum)
        : nums.reduce(
            function(a,b){
                return a+b;
            },
            0
        );


    var combination =
        item.combination ||
        getTypeFromSum(sum);


    var size =
        item.size ||
        (sum < 14 ? "小" : "大");


    var parity =
        item.parity ||
        (sum % 2 === 0 ? "双" : "单");


    var expect =
        item.nbr ||
        item.issue ||
        item.expect ||
        "--";


    var opentime =
        item.drawTime
        ? item.drawTime / 1000
        : (
            item.opentime ||
            Date.now() / 1000
        );


    return {

        expect:String(expect),

        nums:nums,

        sum:sum,

        type:combination,

        size:size,

        parity:parity,

        opentime:opentime

    };

}



/* ============================================================
   请求数据
============================================================ */

async function fetchData(){

    if(isFetching) return;

    isFetching = true;

    $("apiStatus").textContent =
        "⏳ 请求主接口...";

    $("apiBadge").innerHTML = "";


    try{

        var res =
            await fetch(
                API_PRIMARY +
                "&_=" +
                Date.now(),
                {
                    method:"GET",
                    headers:{
                        "Accept":
                        "application/json"
                    },
                    mode:"cors",
                    cache:"no-cache"
                }
            );


        if(!res.ok){

            throw new Error(
                "主接口响应异常"
            );

        }


        var json =
            await res.json();


        if(
            json &&
            Array.isArray(json.data) &&
            json.data.length > 0
        ){

            parseData(
                json.data,
                "primary"
            );


            $("apiStatus").textContent =
                "✅ 主接口成功 · " +
                lotteryHistory.length +
                "期";


            $("apiBadge").innerHTML =
                '<span class="api-badge primary">' +
                "主接口" +
                "</span>";


            isFetching = false;

            return;

        }


        throw new Error(
            "主接口数据为空"
        );


    }catch(e){

        console.warn(
            "主接口失败:",
            e.message
        );


        $("apiStatus").textContent =
            "⚠️ 主接口失败，尝试备用...";


        try{

            var res2 =
                await fetch(
                    API_BACKUP +
                    "&_=" +
                    Date.now(),
                    {
                        method:"GET",
                        headers:{
                            "Accept":
                            "application/json"
                        },
                        mode:"cors",
                        cache:"no-cache"
                    }
                );


            if(!res2.ok){

                throw new Error(
                    "备用接口响应异常"
                );

            }


            var json2 =
                await res2.json();


            if(
                json2 &&
                Array.isArray(json2.data) &&
                json2.data.length > 0
            ){

                parseData(
                    json2.data,
                    "backup"
                );


                $("apiStatus").textContent =
                    "🔄 备用接口成功 · " +
                    lotteryHistory.length +
                    "期";


                $("apiBadge").innerHTML =
                    '<span class="api-badge backup">' +
                    "备用接口" +
                    "</span>";


                isFetching = false;

                return;

            }


            throw new Error(
                "备用接口数据为空"
            );


        }catch(e2){

            console.warn(
                "备用接口失败:",
                e2.message
            );


            tryOffline();

        }

    }

}



/* ============================================================
   本地缓存
============================================================ */

function tryOffline(){

    var cached =
        localStorage.getItem(
            "kill_history"
        );


    if(cached){

        try{

            lotteryHistory =
                JSON.parse(cached);


            if(
                lotteryHistory.length > 0
            ){

                updateUI();


                $("apiStatus").textContent =
                    "💾 本地缓存 (" +
                    lotteryHistory.length +
                    "期)";


                $("apiBadge").innerHTML =
                    '<span class="api-badge cache">' +
                    "缓存" +
                    "</span>";


                isFetching = false;

                return;

            }

        }catch(e){}

    }


    $("apiStatus").textContent =
        "❌ 暂无可用数据";


    $("apiBadge").innerHTML =
        '<span class="api-badge fail">' +
        "失败" +
        "</span>";


    isFetching = false;

}



/* ============================================================
   解析
============================================================ */

function parseData(data,source){

    lotteryHistory =
        data
        .map(normalizeItem)
        .filter(function(x){

            return (
                x.nums &&
                x.nums.length >= 3
            );

        })
        .sort(function(a,b){

            return a.opentime -
                   b.opentime;

        });


    localStorage.setItem(
        "kill_history",
        JSON.stringify(
            lotteryHistory
        )
    );


    updateUI();

}



/* ============================================================
   更新页面
============================================================ */

function updateUI(){

    if(
        !lotteryHistory.length
    ){

        return;

    }


    var asc =
        lotteryHistory
        .slice()
        .sort(function(a,b){

            return a.opentime -
                   b.opentime;

        });


    var latest =
        asc[asc.length - 1];


    $("num1").textContent =
        latest.nums[0];

    $("num2").textContent =
        latest.nums[1];

    $("num3").textContent =
        latest.nums[2];


    $("period").textContent =
        latest.expect + "期";


    $("sumInfo").textContent =
        "和值：" +
        latest.sum +
        " / " +
        latest.type;


    /*
       页面继续保留杀组区域，
       仅作为页面展示功能。
    */

    var kill =
        calcKillGroup(
            latest,
            currentRange
        );


    $("killGroup").textContent =
        kill;


    renderBacktest(asc);

}



/* ============================================================
   历史回测
============================================================ */

function renderBacktest(asc){

    if(asc.length < 2){

        $("historyBody").innerHTML =
            '<tr>' +
            '<td colspan="4">' +
            "数据不足（至少2期）" +
            "</td>" +
            "</tr>";

        $("hitrateBadge").textContent =
            "--";

        return;

    }


    var total =
        asc.length - 1;


    var start =
        Math.max(
            0,
            total - 49
        );


    var rows = "";

    var hitCount = 0;

    var totalCount = 0;


    for(
        var i = total - 1;
        i >= start;
        i--
    ){

        var prev =
            asc[i];

        var cur =
            asc[i + 1];


        var kill =
            calcKillGroup(
                prev,
                currentRange
            );


        var isSpecial =
            (
                cur.sum === 13 ||
                cur.sum === 14
            );


        var isHit =
            isSpecial ||
            cur.type !== kill;


        if(isHit){

            hitCount++;

        }


        totalCount++;


        var resultText =
            isHit
            ? "✅ 杀中"
            : "❌ 杀错";


        var cls =
            isHit
            ? "hit"
            : "miss";


        rows +=
            "<tr>" +

            "<td>" +
            cur.expect +
            "</td>" +

            "<td>" +

            '<span class="kill-badge">' +

            kill +

            "</span>" +

            "</td>" +

            "<td>" +

            cur.nums.join("+") +

            "=" +

            cur.sum +

            " " +

            cur.type +

            "</td>" +

            '<td class="' +
            cls +
            '">' +

            resultText +

            "</td>" +

            "</tr>";

    }


    $("historyBody").innerHTML =
        rows;


    var rate =
        totalCount > 0
        ? Math.round(
            (hitCount / totalCount) *
            1000
          ) / 10
        : 0;


    $("hitrateBadge").textContent =
        "杀组命中率 " +
        rate +
        "% (" +
        hitCount +
        "/" +
        totalCount +
        ")";

}



/* ============================================================
   区间切换
============================================================ */

function setRange(min,max){

    currentRange = {

        min:parseFloat(min),

        max:parseFloat(max)

    };


    $("currentRange").textContent =
        min +
        " ~ " +
        max;


    localStorage.setItem(
        "kill_range",
        JSON.stringify(
            currentRange
        )
    );


    document
    .querySelectorAll(
        ".range-btn"
    )
    .forEach(
        function(btn){

            btn.classList.toggle(
                "active",
                btn.dataset.min === min &&
                btn.dataset.max === max
            );

        }
    );


    if(
        lotteryHistory.length
    ){

        updateUI();

    }

}



/* ============================================================
   初始化
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /* 恢复区间 */

        var stored =
            localStorage.getItem(
                "kill_range"
            );


        if(stored){

            try{

                var r =
                    JSON.parse(
                        stored
                    );


                currentRange = r;


                $("currentRange").textContent =
                    r.min.toFixed(3) +
                    " ~ " +
                    r.max.toFixed(3);


                document
                .querySelectorAll(
                    ".range-btn"
                )
                .forEach(
                    function(btn){

                        btn.classList.toggle(
                            "active",

                            parseFloat(
                                btn.dataset.min
                            ) === r.min &&

                            parseFloat(
                                btn.dataset.max
                            ) === r.max
                        );

                    }
                );


            }catch(e){}

        }



        /* 区间按钮 */

        document
        .querySelectorAll(
            ".range-btn"
        )
        .forEach(
            function(btn){

                btn.onclick =
                    function(){

                        setRange(
                            this.dataset.min,
                            this.dataset.max
                        );

                    };

            }
        );



        /* 刷新 */

        $("refreshBtn").onclick =
            fetchData;



        /* 先读取缓存 */

        var cached =
            localStorage.getItem(
                "kill_history"
            );


        if(cached){

            try{

                lotteryHistory =
                    JSON.parse(
                        cached
                    );


                if(
                    lotteryHistory.length
                ){

                    updateUI();


                    $("apiStatus").textContent =
                        "💾 缓存加载，正在刷新...";

                }

            }catch(e){}

        }



        /* 请求最新 */

        fetchData();



        /* 每35秒刷新 */

        setInterval(
            fetchData,
            35000
        );

    }
