<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小濠预测</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang SC","Microsoft YaHei",sans-serif;
    color:#fff;
    background:
        linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.58)),
        url("background.jpeg") center/cover fixed no-repeat;
}

.container{
    width:94%;
    max-width:1100px;
    margin:auto;
    padding:25px 0 50px;
}

.header{
    text-align:center;
    margin-bottom:22px;
}

.header h1{
    font-size:32px;
    font-weight:800;
    letter-spacing:2px;
    text-shadow:0 3px 12px rgba(0,0,0,.5);
}

.header p{
    margin-top:8px;
    font-size:15px;
    opacity:.92;
}

.card{
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.card-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:16px;
}

.latest{
    text-align:center;
}

.issue{
    font-size:15px;
    opacity:.9;
}

.number{
    margin:13px 0;
    font-size:36px;
    font-weight:900;
    letter-spacing:3px;
}

.combo{
    display:inline-block;
    padding:7px 18px;
    border-radius:20px;
    background:rgba(255,255,255,.2);
    font-weight:700;
}

.countdown{
    margin-top:16px;
    font-size:18px;
    font-weight:700;
}

.next{
    text-align:center;
}

.next-issue{
    font-size:28px;
    font-weight:800;
    margin:10px 0;
}

.pending{
    display:inline-block;
    padding:7px 18px;
    border-radius:20px;
    background:rgba(255,193,7,.25);
    border:1px solid rgba(255,255,255,.2);
    color:#ffe69a;
    font-weight:700;
}

.nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.nav button{
    border:none;
    border-radius:13px;
    padding:13px 5px;
    color:#fff;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.18);
    font-size:14px;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

.nav button.active{
    background:rgba(255,255,255,.3);
    font-weight:700;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th,td{
    padding:12px 6px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.12);
}

th{
    background:rgba(255,255,255,.08);
    font-weight:700;
}

.tag{
    display:inline-block;
    padding:5px 9px;
    border-radius:12px;
    background:rgba(255,255,255,.15);
    white-space:nowrap;
}

.prediction{
    color:#ffe68a;
    font-weight:700;
}

.kill{
    color:#ffb5b5;
    font-weight:700;
}

.status{
    color:#9fffc4;
}

.loading{
    text-align:center;
    padding:25px;
    opacity:.8;
}

.footer{
    text-align:center;
    font-size:12px;
    opacity:.65;
    margin-top:25px;
}

@media(max-width:600px){
    .container{
        width:94%;
        padding-top:18px;
    }

    .header h1{
        font-size:27px;
    }

    .number{
        font-size:31px;
    }

    table{
        font-size:12px;
    }

    th,td{
        padding:9px 3px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>小濠预测</h1>
        <p>🇨🇦 加拿大28 · 实时开奖数据中心</p>
    </div>

    <!-- 最新开奖 -->
    <div class="card latest">
        <div class="card-title">🎯 最新开奖</div>

        <div class="issue" id="currentIssue">
            正在连接开奖数据…
        </div>

        <div class="number" id="currentNumber">
            --+--+--=--
        </div>

        <div class="combo" id="currentCombo">
            --
        </div>

        <div class="countdown">
            ⏱ 距离下一期开奖：
            <span id="countdown">--:--</span>
        </div>
    </div>

    <!-- 下一期 -->
    <div class="card next">
        <div class="card-title">🔮 下一期</div>

        <div class="next-issue" id="nextIssue">
            第------期
        </div>

        <div class="pending">
            待开奖
        </div>
    </div>

    <!-- 导航 -->
    <div class="nav">
        <button class="active" onclick="showSection('latest',this)">
            最新开奖
        </button>

        <button onclick="showSection('trend',this)">
            近期走势
        </button>

        <button onclick="showSection('history',this)">
            历史开奖
        </button>

        <button onclick="showSection('prediction',this)">
            预测
        </button>

        <button onclick="showSection('kill',this)">
            杀组
        </button>

        <button onclick="showSection('stats',this)">
            数据统计
        </button>
    </div>

    <!-- 最新开奖 -->
    <div id="latest" class="section active">
        <div class="card">
            <div class="card-title">📌 最新开奖记录</div>

            <div id="latestTable" class="loading">
                正在加载…
            </div>
        </div>
    </div>

    <!-- 近期走势 -->
    <div id="trend" class="section">
        <div class="card">
            <div class="card-title">📈 近期走势</div>

            <div id="trendTable" class="loading">
                正在加载…
            </div>
        </div>
    </div>

    <!-- 历史开奖 -->
    <div id="history" class="section">
        <div class="card">
            <div class="card-title">📜 历史开奖</div>

            <div id="historyTable" class="loading">
                正在加载…
            </div>
        </div>
    </div>

    <!-- 预测 -->
    <div id="prediction" class="section">
        <div class="card">
            <div class="card-title">🔮 预测</div>

            <table>
                <thead>
                    <tr>
                        <th>期号</th>
                        <th>上一把跳</th>
                        <th>预测</th>
                        <th>状态</th>
                    </tr>
                </thead>

                <tbody id="predictionBody">
                    <tr>
                        <td colspan="4">等待数据…</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 杀组 -->
    <div id="kill" class="section">
        <div class="card">
            <div class="card-title">🎯 杀组</div>

            <table>
                <thead>
                    <tr>
                        <th>期号</th>
                        <th>时间</th>
                        <th>杀组</th>
                        <th>号码</th>
                        <th>结果</th>
                        <th>状态</th>
                    </tr>
                </thead>

                <tbody id="killBody">
                    <tr>
                        <td colspan="6">等待数据…</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 数据统计 -->
    <div id="stats" class="section">
        <div class="card">
            <div class="card-title">📊 数据统计</div>

            <table>
                <tbody id="statsBody">
                    <tr>
                        <td>数据状态</td>
                        <td>正在加载…</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        小濠预测 · 加拿大28实时开奖数据中心
    </div>

</div>

<script>

let allData = [];
let latestData = null;
let countdownSeconds = 0;


/* =========================
   获取开奖数据
========================= */

async function loadData(){

    try{

        const response = await fetch(
            "/api/kj.json?nbr=20",
            {
                cache:"no-store"
            }
        );

        const result = await response.json();

        let data = result.data || result;

        if(!Array.isArray(data)){
            data = [];
        }

        allData = data;

        if(data.length > 0){

            latestData = data[0];

            updateLatest(latestData);

            updateTables(data);

            updatePrediction(data);

            updateKill(data);

            updateStats(data);
        }

    }catch(error){

        console.error(error);

        document.getElementById("currentIssue").innerText =
            "开奖数据连接失败";

    }
}


/* =========================
   最新开奖
========================= */

function updateLatest(x){

    const issue =
        x.period ||
        x.issue ||
        x.qh ||
        x.expect ||
        x.nbr ||
        "--";

    const number =
        x.number ||
        x.numbers ||
        "";

    const combo =
        x.combination ||
        x.combo ||
        x.type ||
        "--";

    document.getElementById("currentIssue").innerText =
        "当前期：第" + issue + "期";

    document.getElementById("currentNumber").innerText =
        formatNumber(number);

    document.getElementById("currentCombo").innerText =
        combo;

    /* 下一期 */
    const nextIssue =
        Number(issue) + 1;

    document.getElementById("nextIssue").innerText =
        "第" + nextIssue + "期";

    startCountdown(x);

}


/* =========================
   格式化号码
========================= */

function formatNumber(number){

    if(Array.isArray(number)){
        return number.join("+");
    }

    if(typeof number === "string"){

        if(number.includes("=")){
            return number;
        }

        const nums =
            number.match(/\d+/g);

        if(nums && nums.length >= 3){

            return nums.slice(0,3).join("+")
                + "="
                + (
                    Number(nums[0])+
                    Number(nums[1])+
                    Number(nums[2])
                );
        }
    }

    return number || "--";
}


/* =========================
   倒计时
========================= */

function startCountdown(x){

    if(x.countdown !== undefined){

        countdownSeconds =
            Number(x.countdown) || 0;

    }else{

        const time =
            x.time ||
            x.open_time ||
            x.datetime;

        if(time){

            const t =
                new Date(time).getTime();

            const next =
                t + 210000;

            countdownSeconds =
                Math.max(
                    0,
                    Math.floor(
                        (next-Date.now())/1000
                    )
                );

        }else{

            countdownSeconds = 0;

        }
    }

    updateCountdown();
}


function updateCountdown(){

    const el =
        document.getElementById("countdown");

    let sec =
        Math.max(0,countdownSeconds);

    const min =
        Math.floor(sec/60);

    const s =
        sec%60;

    el.innerText =
        String(min).padStart(2,"0")
        + ":"
        + String(s).padStart(2,"0");

}


/* 每秒更新 */

setInterval(()=>{

    if(countdownSeconds > 0){

        countdownSeconds--;

        updateCountdown();

    }

},1000);


/* =========================
   最新开奖表格
========================= */

function updateTables(data){

    let html = `
    <table>
        <thead>
            <tr>
                <th>期号</th>
                <th>号码</th>
                <th>结果</th>
            </tr>
        </thead>
        <tbody>
    `;

    data.slice(0,10).forEach(x=>{

        const issue =
            x.period ||
            x.issue ||
            x.qh ||
            "--";

        const number =
            x.number ||
            "--";

        const combo =
            x.combination ||
            x.combo ||
            x.type ||
            "--";

        html += `
        <tr>
            <td>${issue}</td>
            <td>${formatNumber(number)}</td>
            <td>
                <span class="tag">${combo}</span>
            </td>
        </tr>
        `;

    });

    html += `
        </tbody>
    </table>
    `;

    document.getElementById("latestTable").innerHTML =
        html;


    /* 近期走势 */

    let trend = `
    <table>
        <thead>
            <tr>
                <th>期号</th>
                <th>组合</th>
                <th>号码</th>
            </tr>
        </thead>
        <tbody>
    `;

    data.slice(0,20).forEach(x=>{

        const issue =
            x.period ||
            x.issue ||
            x.qh ||
            "--";

        const number =
            x.number ||
            "--";

        const combo =
            x.combination ||
            x.combo ||
            x.type ||
            "--";

        trend += `
        <tr>
            <td>${issue}</td>
            <td>${combo}</td>
            <td>${formatNumber(number)}</td>
        </tr>
        `;

    });

    trend += `
        </tbody>
    </table>
    `;

    document.getElementById("trendTable").innerHTML =
        trend;


    /* 历史 */

    let history = `
    <table>
        <thead>
            <tr>
                <th>期号</th>
                <th>时间</th>
                <th>号码</th>
                <th>组合</th>
            </tr>
        </thead>
        <tbody>
    `;

    data.forEach(x=>{

        const issue =
            x.period ||
            x.issue ||
            x.qh ||
            "--";

        const time =
            x.time ||
            "--";

        const number =
            x.number ||
            "--";

        const combo =
            x.combination ||
            x.combo ||
            x.type ||
            "--";

        history += `
        <tr>
            <td>${issue}</td>
            <td>${time}</td>
            <td>${formatNumber(number)}</td>
            <td>${combo}</td>
        </tr>
        `;

    });

    history += `
        </tbody>
    </table>
    `;

    document.getElementById("historyTable").innerHTML =
        history;

}


/* =========================
   预测显示
========================= */

function updatePrediction(data){

    let html = "";

    data.slice(0,10).forEach((x,index)=>{

        const issue =
            x.period ||
            x.issue ||
            x.qh ||
            "--";

        /*
         * 这里仅展示预先提供的规则。
         * 不自动生成下一期投注建议。
         */

        let prediction = "--";

        html += `
        <tr>
            <td>${issue}</td>
            <td>--</td>
            <td class="prediction">
                ${prediction}
            </td>
            <td class="status">
                已开奖
            </td>
        </tr>
        `;

    });

    document.getElementById("predictionBody").innerHTML =
        html || `
        <tr>
            <td colspan="4">暂无数据</td>
        </tr>
        `;

}


/* =========================
   杀组显示
========================= */

function updateKill(data){

    let html = "";

    data.slice(0,10).forEach(x=>{

        const issue =
            x.period ||
            x.issue ||
            x.qh ||
            "--";

        const time =
            x.time ||
            "--";

        const number =
            x.number ||
            "--";

        const combo =
            x.combination ||
            x.combo ||
            x.type ||
            "--";

        html += `
        <tr>
            <td>${issue}</td>
            <td>${time}</td>

            <td class="kill">
                --
            </td>

            <td>${formatNumber(number)}</td>

            <td>
                <span class="tag">
                    ${combo}
                </span>
            </td>

            <td class="status">
                已开奖
            </td>
        </tr>
        `;

    });

    document.getElementById("killBody").innerHTML =
        html || `
        <tr>
            <td colspan="6">暂无数据</td>
        </tr>
        `;

}


/* =========================
   统计
========================= */

function updateStats(data){

    const total =
        data.length;

    const latest =
        data[0];

    const issue =
        latest ?
        (
            latest.period ||
            latest.issue ||
            latest.qh ||
            "--"
        )
        :
        "--";

    document.getElementById("statsBody").innerHTML = `
        <tr>
            <td>已获取开奖数量</td>
            <td>${total} 期</td>
        </tr>

        <tr>
            <td>最新期号</td>
            <td>第${issue}期</td>
        </tr>

        <tr>
            <td>数据状态</td>
            <td class="status">正常</td>
        </tr>
    `;

}


/* =========================
   页面切换
========================= */

function showSection(id,button){

    document
        .querySelectorAll(".section")
        .forEach(el=>{
            el.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    document
        .querySelectorAll(".nav button")
        .forEach(el=>{
            el.classList.remove("active");
        });

    button.classList.add("active");

}


/* =========================
   自动刷新
========================= */

loadData();

setInterval(loadData,5000);

</script>

</body>
</html>
