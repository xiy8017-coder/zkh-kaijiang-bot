<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小濠预测</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:#14203b;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    linear-gradient(#ffffff22,#ffffff22),
    url("background.jpeg") center/cover fixed no-repeat;
}

.app{
  max-width:760px;
  margin:auto;
  padding:55px 18px 100px;
}

h1{
  font-size:42px;
  margin:5px 8px 10px;
  font-weight:900;
}

.line{
  width:68px;
  height:8px;
  background:#c62d72;
  border-radius:8px;
  margin:0 8px 30px;
}

.card{
  background:#fffefcf0;
  border-radius:34px;
  margin-bottom:26px;
  box-shadow:0 10px 30px #3b24331f;
  overflow:hidden;
}

.count,
.result{
  padding:30px 34px;
}

.row,
.sub{
  display:flex;
  justify-content:space-between;
  color:#687287;
  font-size:21px;
}

.big{
  text-align:center;
  font-size:62px;
  font-weight:900;
  margin:25px 0;
}

.progress{
  height:11px;
  background:#e6e1e5;
  border-radius:10px;
  margin-top:25px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:#c62d72;
  width:50%;
}

.issue{
  font-size:27px;
  font-weight:900;
}

.time{
  font-size:19px;
  color:#748096;
  margin-left:8px;
}

.nums{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:28px;
}

.num{
  height:160px;
  border-radius:32px;
  background:#fff2f8;
  border:2px solid #efcade;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:56px;
  font-weight:900;
}

.num:last-child{
  background:#c62d72;
  color:white;
  border-color:#c62d72;
}

.tabs{
  display:flex;
  gap:14px;
  padding:27px 28px 18px;
  overflow:auto;
}

.tab{
  border:1px solid #ddd8df;
  background:white;
  border-radius:20px;
  padding:16px 30px;
  font-size:20px;
  color:#5f7898;
  white-space:nowrap;
}

.tab.active{
  background:#c62d72;
  color:white;
  border-color:#c62d72;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:620px;
}

th,
td{
  padding:20px 28px;
  text-align:left;
  font-size:18px;
  border-top:1px solid #eee8ed;
  white-space:nowrap;
}

th{
  color:#657087;
  background:#f8f4f7;
}

.kill{
  padding:30px;
  text-align:center;
}

.killbox{
  padding:30px;
  border-radius:25px;
  background:#fff1f6;
  border:2px solid #efcade;
  color:#c62d72;
  font-size:32px;
  font-weight:900;
}

.note{
  color:#778096;
  font-size:14px;
  margin-top:15px;
}

.bottom{
  position:fixed;
  z-index:9;
  bottom:0;
  left:0;
  right:0;
  background:#fffffff5;
  border-top:1px solid #eee;
}

.bottomin{
  max-width:760px;
  margin:auto;
  height:82px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#778096;
  font-size:16px;
}

.nav b{
  font-size:27px;
}

.nav.active{
  color:#c62d72;
  font-weight:800;
}

@media(max-width:520px){

  .big{
    font-size:57px;
  }

  .num{
    height:128px;
    font-size:48px;
  }

  .issue{
    font-size:24px;
  }

  .time{
    font-size:16px;
  }
}
</style>
</head>

<body>

<main class="app">

  <h1>小濠预测</h1>
  <div class="line"></div>

  <!-- 下一期倒计时 -->
  <section class="card count">

    <div class="row">
      <span>◷　下一期倒计时</span>
      <span id="nextIssue">第 -- 期</span>
    </div>

    <div class="big" id="countdown">
      --分--秒
    </div>

    <div class="sub">
      <span>约 3.5 分钟一期</span>
      <span id="openTime">开奖 --:--:--</span>
    </div>

    <div class="progress">
      <i id="bar"></i>
    </div>

  </section>


  <!-- 最新开奖 -->
  <section class="card result">

    <div>
      <span class="issue" id="latestIssue">第--期</span>
      <span class="time" id="latestTime">--</span>
    </div>

    <div class="nums">

      <div class="num" id="n1">-</div>

      <div class="num" id="n2">-</div>

      <div class="num" id="n3">-</div>

      <div class="num" id="sum">-</div>

    </div>

  </section>


  <!-- 数据区域 -->
  <section class="card">

    <div class="tabs">

      <button class="tab active" data-p="result">
        开奖结果
      </button>

      <button class="tab" data-p="trend">
        最近57期
      </button>

      <button class="tab" data-p="kill">
        杀组
      </button>

    </div>


    <!-- 开奖结果 -->
    <div id="result" style="overflow:auto">

      <table>

        <thead>
          <tr>
            <th>期号</th>
            <th>时间</th>
            <th>号码</th>
            <th>组合</th>
          </tr>
        </thead>

        <tbody id="rows">

          <tr>
            <td colspan="4" style="text-align:center">
              正在同步数据…
            </td>
          </tr>

        </tbody>

      </table>

    </div>


    <!-- 最近57期 -->
    <div id="trend" style="display:none;overflow:auto">

      <table>

        <thead>
          <tr>
            <th>期号</th>
            <th>时间</th>
            <th>号码</th>
            <th>组合</th>
          </tr>
        </thead>

        <tbody id="trendRows"></tbody>

      </table>

    </div>


    <!-- 杀组 -->
    <div id="kill" class="kill" style="display:none">

      <div style="
        font-size:25px;
        font-weight:900;
        margin-bottom:20px;
      ">
        杀组
      </div>

      <div class="killbox">
        可能不会来
      </div>

      <div class="note">
        仅作娱乐展示，不代表下一期开奖预测
      </div>

    </div>

  </section>

</main>


<!-- 底部导航 -->
<nav class="bottom">

  <div class="bottomin">

    <div class="nav active">
      <b>⌂</b>
      <span>首页</span>
    </div>

    <div class="nav">
      <b>▣</b>
      <span>大厅</span>
    </div>

    <div class="nav">
      <b>🚀</b>
      <span>飞投</span>
    </div>

    <div class="nav">
      <b>♙</b>
      <span>我的</span>
    </div>

  </div>

</nav>


<script>

const API="/api/kj.json";

let target=null;

let lastIssue=null;


/* 读取开奖号码 */
function getNums(x){

  let m=String(
    x.number ?? ""
  ).match(/\d+/g);

  return m && m.length>=3
    ? m.slice(0,3).map(Number)
    : [];
}


/* 读取期号 */
function getIssue(x){

  return String(
    x.nbr ??
    x.issue ??
    x.period ??
    x.qh ??
    "--"
  );

}


/* 读取倒计时 */
function cdSec(v){

  if(typeof v==="number")
    return v;

  let m=String(v ?? "").match(
    /^(\d+):(\d{1,2})(?::(\d{1,2}))?$/
  );

  if(!m)
    return null;

  return m[3]
    ? +m[1]*3600 + +m[2]*60 + +m[3]
    : +m[1]*60 + +m[2];

}


/* 获取开奖数据 */
async function load(){

  try{

    let r=await fetch(
      API+"?nbr=57&t="+Date.now(),
      {
        cache:"no-store"
      }
    );

    let j=await r.json();

    let a=
      j.data ||
      j.results ||
      j.list ||
      [];

    if(!a.length)
      throw 0;


    let x=a[0];

    let no=getIssue(x);

    let nums=getNums(x);


    /* 最新一期 */

    document.getElementById(
      "latestIssue"
    ).textContent=
      "第"+no+"期";


    document.getElementById(
      "latestTime"
    ).textContent=
      x.time || "--";


    /* 最新号码 */

    if(nums.length>=3){

      document.getElementById(
        "n1"
      ).textContent=nums[0];

      document.getElementById(
        "n2"
      ).textContent=nums[1];

      document.getElementById(
        "n3"
      ).textContent=nums[2];

      document.getElementById(
        "sum"
      ).textContent=
        nums[0]+nums[1]+nums[2];

    }


    /* 下一期 */

    document.getElementById(
      "nextIssue"
    ).textContent=
      "第 "+(Number(no)+1)+" 期";


    /* 最近开奖 */

    let rows=a.slice(0,20).map(x=>{

      let n=getNums(x);

      return `
        <tr>
          <td>
            <b>${getIssue(x)}</b>
          </td>

          <td>
            ${x.time || "--"}
          </td>

          <td>
            ${
              n.length>=3
              ? n.join(" + ")
              : (x.number || "--")
            }
          </td>

          <td>
            ${x.combination || "--"}
          </td>
        </tr>
      `;

    }).join("");


    document.getElementById(
      "rows"
    ).innerHTML=rows;


    /* 57期走势 */

    document.getElementById(
      "trendRows"
    ).innerHTML=

      a.map(x=>{

        let n=getNums(x);

        return `
          <tr>

            <td>
              <b>${getIssue(x)}</b>
            </td>

            <td>
              ${x.time || "--"}
            </td>

            <td>
              ${
                n.length>=3
                ? n.join(" + ")
                : (x.number || "--")
              }
            </td>

            <td>
              ${x.combination || "--"}
            </td>

          </tr>
        `;

      }).join("");


    /* 倒计时 */

    let c=cdSec(j.countdown);


    if(
      c!==null &&
      (
        target===null ||
        no!==lastIssue ||
        Date.now()>=target
      )
    ){

      target=
        Date.now()+
        c*1000;

    }


    lastIssue=no;

  }

  catch(e){

    console.log(
      "开奖数据同步失败",
      e
    );

  }

}


/* 倒计时显示 */

function clock(){

  if(target===null)
    return;


  let s=Math.max(
    0,
    Math.ceil(
      (target-Date.now())/1000
    )
  );


  let m=Math.floor(s/60);

  let q=s%60;


  document.getElementById(
    "countdown"
  ).textContent=
    m+
    "分"+
    String(q).padStart(2,"0")+
    "秒";


  /* 开奖时间 */

  let d=new Date(target);

  let p=n=>
    String(n).padStart(2,"0");


  document.getElementById(
    "openTime"
  ).textContent=
    "开奖 "+
    p(d.getHours())+
    ":"+
    p(d.getMinutes())+
    ":"+
    p(d.getSeconds());


  /* 进度条 */

  document.getElementById(
    "bar"
  ).style.width=
    Math.max(
      3,
      Math.min(
        100,
        100-s/210*100
      )
    )+"%";

}


/* 页面三个按钮 */

document.querySelectorAll(
  ".tab"
).forEach(b=>{

  b.onclick=()=>{

    document.querySelectorAll(
      ".tab"
    ).forEach(x=>
      x.classList.remove("active")
    );

    b.classList.add("active");


    [
      "result",
      "trend",
      "kill"
    ].forEach(x=>{

      document.getElementById(
        x
      ).style.display="none";

    });


    document.getElementById(
      b.dataset.p
    ).style.display="";

  };

});


/* 开始 */

load();

setInterval(
  load,
  10000
);

setInterval(
  clock,
  1000
);

clock();

</script>

</body>
</html>
